<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="format-detection" content="telephone=no">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f6ef7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>潇潇的工作台</title>
<style>
:root{
  --bg:#faf4ec;--surface:#ffffff;--border:#f0e8db;--text:#3a3a3a;
  --text-sub:#9a9a9e;--text-mute:#c8c8cc;--accent:#f5a8b8;--accent-soft:#fce8ed;
  --green:#a8d4b8;--orange:#f5cba7;--red:#f5a8a8;--purple:#c8b8e0;
  --blue:#a8c8e8;--blue-soft:#e8f0f8;
  --radius:18px;--shadow:0 2px 12px rgba(180,150,120,.08);
  --shadow-hover:0 6px 20px rgba(180,150,120,.15);
  --chuanye:#c8b8e0;--baishe:#a8d4c8;
  --grad-pink:linear-gradient(135deg,#fce8ed 0%,#f5d0d8 100%);
  --grad-blue:linear-gradient(135deg,#e8f0f8 0%,#d0e0f0 100%);
  --grad-warm:linear-gradient(135deg,#faf4ec 0%,#f5e8d8 100%);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#d8d8de;border-radius:3px}::-webkit-scrollbar-track{background:transparent}
.app{display:grid;grid-template-columns:240px 1fr 300px;height:100vh}
.sidebar{background:var(--surface);border-right:none;overflow-y:auto}
.brand{padding:24px 20px 18px;font-size:20px;font-weight:700;color:var(--text);background:transparent}.brand span{color:var(--accent)}
.brand-sub{padding:0 20px 18px;font-size:13px;color:var(--text-sub)}
.nav-group{padding:8px 16px}
.nav-group-title{font-size:11px;color:var(--text-mute);padding:12px 14px 6px;font-weight:500;letter-spacing:.3px;display:flex;align-items:center;gap:6px;text-transform:none}
.nav-group-title .dot{width:8px;height:8px;border-radius:50%}
.nav-brand-header{font-size:12px;font-weight:700;padding:10px 8px 4px;display:flex;align-items:center;gap:6px;margin-top:4px}
.nav-brand-header .dot{width:8px;height:8px;border-radius:50%}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;cursor:pointer;color:var(--text-sub);font-size:14px;transition:all .2s;margin-bottom:2px}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;position:relative}
.nav-item .ico{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.nav-item.sub{padding-left:28px;font-size:12px}
.nav-badge{margin-left:auto;font-size:11px;background:#eee;color:#888;border-radius:10px;padding:1px 7px}
.nav-item.active .nav-badge{background:var(--accent);color:#fff}
.main{overflow-y:auto;padding:24px 28px}
.page-header{display:flex;align-items:flex-start;margin-bottom:22px;gap:12px}
.page-header h1{font-size:24px;font-weight:700;letter-spacing:-.5px}
.page-header .sub{font-size:13px;color:var(--text-sub);margin-top:4px}
.page-header-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.brand-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 10px;border-radius:10px;font-weight:600}
.tag-chuanye{background:#f0edff;color:var(--chuanye)}.tag-baishe{background:#e0f5f0;color:var(--baishe)}
.rightpanel{background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:20px}
.rp-section{margin-bottom:24px}
.rp-title{font-size:12px;font-weight:700;color:var(--text-mute);letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.rp-title a{color:var(--accent);font-size:11px;font-weight:500;cursor:pointer;text-transform:none}
.card{background:var(--surface);border:none;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:all .25s cubic-bezier(.4,0,.2,1)}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}.card[style*="--gc"]{position:relative;overflow:hidden}.card[style*="--gc"]::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gc);opacity:.6}.card-title{font-size:15px;font-weight:600;margin-bottom:14px;color:var(--text)}
.card-grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);transition:all .25s;position:relative;overflow:hidden}.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gc,var(--grad-blue))}
.stat .label{font-size:12px;color:var(--text-mute)}.stat .num{font-size:28px;font-weight:700;margin-top:6px;line-height:1;color:var(--accent);font-family:-apple-system,sans-serif}.stat .num small{font-size:13px;font-weight:400;color:var(--text-sub);margin-left:3px}.stat .num.text-red{color:#f59595 !important}.stat .num.text-green{color:var(--blue) !important}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:13px;color:var(--text);transition:all .2s;font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(245,168,184,.3)}.btn-primary:hover{background:#f595a8;color:#fff;box-shadow:0 4px 14px rgba(245,168,184,.4)}.btn-primary:active{transform:scale(.97)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:10px}
.btn-icon{width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text-sub);font-size:14px}
.btn-icon:hover{color:var(--accent);border-color:var(--accent)}
.btn-danger{color:var(--red);border-color:#ffcaca}.btn-danger:hover{background:#fff0f0}
.input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:12px;font-size:14px;background:#fcfaf6;color:var(--text);font-family:inherit;transition:all .2s}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,168,184,.15);background:#fff}
textarea.input{resize:vertical;min-height:60px}
select.input{cursor:pointer}
.tag{font-size:10px;padding:2px 7px;border-radius:10px;background:#eee;color:#666}
.tag-xhs{background:#ffeaea;color:#ff2442}.tag-dy{background:#f0f0f0;color:#161823}.tag-wx{background:#e8f5e8;color:#07c160}.tag-bili{background:#e8f0ff;color:#fb7299}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text-sub)}
.table-wrap{overflow-x:auto;border:none;border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg);padding:12px 14px;text-align:left;font-weight:500;color:var(--text-sub);font-size:12px;border-bottom:none;white-space:nowrap}
td{padding:14px;border-bottom:1px solid var(--bg);white-space:nowrap}tr:last-child td{border-bottom:none}tr:hover td{background:#fcfaf6}
.progress{height:6px;background:#f0e8db;border-radius:3px;overflow:hidden;margin-top:6px}
.progress-bar{height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease}
.progress-bar.green{background:var(--blue)}.progress-bar.orange{background:var(--accent)}.progress-bar.red{background:#f5a8a8}
.timeline{position:relative;padding-left:24px}
.timeline:before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--accent-soft)}
.tl-item{position:relative;padding:10px 0 10px 16px}
.tl-item:before{content:'';position:absolute;left:-20px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 3px var(--accent-soft)}
.tl-item.done:before{background:var(--green)}.tl-item.overdue:before{background:var(--red)}
.tl-item .tl-time{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:3px}
.tl-item.overdue .tl-time{color:var(--red)}.tl-item.done .tl-text{text-decoration:line-through;color:var(--text-mute)}
.tl-item .tl-text{font-size:14px}.tl-item .tl-note{font-size:12px;color:var(--text-sub);margin-top:3px}
.tl-item .tl-actions{margin-top:6px;display:flex;gap:6px;opacity:0;transition:opacity .15s}.tl-item:hover .tl-actions{opacity:1}
.alert-banner{background:var(--accent-soft);border:none;border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:13px}
.alert-banner.urgent{background:#fce0e0}.alert-banner .alert-icon{font-size:20px}
.rp-todo{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}.rp-todo:last-child{border:none}
.rp-todo .mini-check{width:14px;height:14px;border:1.5px solid #ccc;border-radius:4px;cursor:pointer;flex-shrink:0}
.rp-todo .mini-check.done{background:var(--green);border-color:var(--green)}
.rp-todo .mini-check.done:after{content:"✓";font-size:10px;color:#fff;display:flex;align-items:center;justify-content:center;height:100%;font-weight:700}
.rp-todo .t{flex:1;font-size:12px}.rp-todo.done .t{text-decoration:line-through;color:var(--text-mute)}
.rp-event{padding:8px 10px;background:var(--bg);border-radius:8px;margin-bottom:6px;border-left:3px solid var(--accent)}
.rp-event.warn{border-left-color:var(--orange);background:#fff8ed}.rp-event.urgent{border-left-color:var(--red);background:#fff0f0}
.rp-event .et{font-size:12px;font-weight:600}.rp-event .em{font-size:11px;color:var(--text-sub);margin-top:2px}
.quick-add{display:flex;gap:6px;margin-top:8px}.quick-add .input{font-size:12px;padding:6px 10px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.show{display:flex;animation:overlayIn .2s ease}.modal-overlay.show .modal{animation:modalIn .3s cubic-bezier(.4,0,.2,1)}@keyframes overlayIn{from{opacity:0}to{opacity:1}}@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal{background:var(--surface);border-radius:20px;padding:28px;width:520px;max-width:90vw;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(180,150,120,.2)}
.modal h2{font-size:20px;font-weight:700;margin-bottom:20px;color:var(--text)}
.modal-row{margin-bottom:14px}.modal-row label{display:block;font-size:12px;color:var(--text-sub);margin-bottom:5px;font-weight:500}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.empty{text-align:center;padding:40px 20px;color:var(--text-mute);font-size:13px}.empty .big{font-size:40px;margin-bottom:10px;opacity:.4}
.flex{display:flex;align-items:center;gap:10px}.flex-between{display:flex;align-items:center;justify-content:space-between}
.mt{margin-top:16px}.mt2{margin-top:8px}.mb{margin-bottom:16px}.mb2{margin-bottom:8px}
.text-sub{color:var(--text-sub)}.text-mute{color:var(--text-mute)}.text-green{color:var(--blue)}.text-red{color:#f59595}.text-orange{color:var(--accent)}.text-purple{color:var(--purple)}
.text-sm{font-size:12px}.text-xs{font-size:11px}
.store-tabs{display:flex;gap:6px;margin-bottom:16px}
.store-tab{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:13px;color:var(--text-sub);transition:all .15s}
.store-tab.active{background:var(--baishe);color:#fff;border-color:var(--baishe)}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:60%;background:var(--accent);border-radius:4px 4px 0 0;min-height:3px;transition:height .3s}.bar:hover{background:#3d5be0}.bar-label{font-size:10px;color:var(--text-mute)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-head{font-size:11px;color:var(--text-mute);text-align:center;font-weight:500;padding:6px 0}
.cal-cell{min-height:70px;border:1px solid var(--border);border-radius:6px;padding:6px 4px;font-size:11px;background:var(--surface);cursor:pointer;transition:all .15s;overflow:hidden}
.cal-cell:hover{border-color:var(--accent)}.cal-cell.other{opacity:.35}.cal-cell.today{border-color:var(--accent);border-width:2px}
.cal-cell .date{font-weight:600;color:var(--text);font-size:12px;margin-bottom:2px}
.cal-event{font-size:9px;background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 4px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.paste-area{width:100%;min-height:120px;border:1px dashed var(--border);border-radius:8px;padding:10px;font-size:12px;font-family:inherit;resize:vertical;background:var(--bg);color:var(--text)}
.paste-area:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-height:400px}
.kanban-col{background:var(--bg);border-radius:10px;padding:12px;min-height:200px}
.kanban-col h4{font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.kanban-col h4 .cnt{background:#ddd;color:#666;border-radius:10px;padding:1px 7px;font-size:11px}
.kanban-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.kanban-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);transform:translateY(-1px)}
.kanban-card .kc-title{font-size:13px;font-weight:500;margin-bottom:5px}.kanban-card .kc-meta{display:flex;gap:6px;flex-wrap:wrap}
.del-x{cursor:pointer;color:var(--text-mute);font-size:18px;padding:0 6px;opacity:.4;transition:opacity .15s}.del-x:hover{opacity:1;color:var(--red)}
.fade-in{animation:fadeIn .3s cubic-bezier(.4,0,.2,1)}
@keyframes fadeIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.lesson-step{display:flex;gap:10px;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
.lesson-step-num{width:24px;height:24px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.week-grid{display:grid;grid-template-columns:72px repeat(7,1fr);gap:4px}
.week-slot{min-height:54px;border:1px solid var(--border);border-radius:6px;padding:3px;font-size:10px;background:var(--surface);overflow:hidden;display:flex;align-items:center;justify-content:center}
.week-slot.head,.week-slot.time{flex-direction:column;justify-content:center}
.week-slot .ws-time{font-weight:600;color:var(--text-sub);font-size:10px;white-space:nowrap}
.week-lesson{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:4px 5px;font-size:10px;cursor:pointer;line-height:1.3;width:100%;overflow:hidden}
.week-lesson .wl-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.week-lesson .ws-students{font-size:9px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:1px}
.flow-step{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;border:1px solid var(--border);margin-bottom:8px;cursor:pointer;transition:all .15s}
.flow-step:hover{border-color:var(--chuanye);background:#f5f3ff}
.flow-step.active{border-color:var(--chuanye);background:#f0edff}
.flow-step .fs-num{width:24px;height:24px;border-radius:50%;background:var(--chuanye);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.flow-step .fs-title{font-size:13px;font-weight:600}.flow-step .fs-desc{font-size:11px;color:var(--text-sub)}
/* ===== 健身体重曲线 ===== */
.weight-chart-box{position:relative;width:100%;height:180px;background:var(--bg);border-radius:12px;padding:12px;overflow:hidden}
.weight-chart-box svg{width:100%;height:100%}
.habit-card{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:10px}
.habit-card .h-info{display:flex;align-items:center;gap:10px}
.habit-card .h-icon{font-size:28px}
.habit-card .h-name{font-size:14px;font-weight:600}
.habit-card .h-streak{font-size:11px;color:var(--text-sub)}
.habit-btn{padding:8px 18px;border-radius:12px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
.habit-btn.done{background:var(--green);color:#fff}
.habit-btn:not(.done){background:var(--accent-soft);color:var(--accent)}
.habit-btn:active{transform:scale(.95)}
/* ===== 菜谱记录 ===== */
.recipe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.recipe-card{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:all .25s}
.recipe-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.recipe-cover{width:100%;height:140px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
.recipe-cover img{width:100%;height:100%;object-fit:cover}
.recipe-info{padding:12px 14px}
.recipe-name{font-size:14px;font-weight:600;margin-bottom:4px}
.recipe-preview{font-size:11px;color:var(--text-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:768px){.recipe-grid{grid-template-columns:repeat(2,1fr)}.recipe-cover{height:110px}}
/* ===== 课件库样式 ===== */
.cw-cat-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.cw-cat-tab{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:13px;color:var(--text-sub);transition:all .2s;white-space:nowrap}
.cw-cat-tab:hover{border-color:var(--accent)}
.cw-cat-tab.active{font-weight:600;color:var(--text)}
.cw-cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cw-cat-cnt{font-size:10px;background:var(--bg);color:var(--text-mute);border-radius:8px;padding:1px 6px;margin-left:2px}
.cw-season-card{margin-bottom:14px}
.cw-list{min-height:40px}
.cw-item{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;transition:all .2s;cursor:default;overflow:hidden}
.cw-item:hover{box-shadow:var(--shadow);transform:translateX(2px)}
.cw-item.done{background:var(--bg);opacity:.7}
.cw-item-bar{width:4px;flex-shrink:0}
.cw-item-body{flex:1;padding:10px 14px;cursor:pointer}
.cw-item-title{font-size:14px;font-weight:600;color:var(--text)}
.cw-item.done .cw-item-title{text-decoration:underline;text-decoration-color:var(--green);text-underline-offset:3px}
.cw-done-text{text-decoration:underline !important;text-decoration-color:var(--green) !important;text-underline-offset:3px}
.cw-item-desc{font-size:12px;color:var(--text-sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw-item-meta{font-size:11px;color:var(--text-mute);margin-top:5px;display:flex;gap:6px}
.cw-item-actions{display:flex;align-items:center;gap:4px;padding:0 8px}
.cw-drag-over{border:2px dashed var(--accent) !important;background:var(--accent-soft)}
.cw-img-preview{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.cw-thumb-wrap{position:relative;width:72px;height:72px}
.cw-thumb{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
.cw-thumb-x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;background:var(--red);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;line-height:1}
.cw-upload-area{border:1px dashed var(--border);border-radius:12px;padding:12px;background:var(--bg)}
.cw-view-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:8px}
.cw-view-imgs img{width:100%;height:100px;object-fit:cover;border-radius:10px;border:1px solid var(--border);cursor:pointer}
@media(max-width:768px){
  .cw-cat-bar{gap:4px}
  .cw-cat-tab{padding:6px 10px;font-size:12px}
  .cw-item-actions{gap:2px;padding:0 4px}
  .cw-item-body{padding:8px 10px}
  .cw-thumb{width:60px;height:60px}
  .cw-thumb-wrap{width:60px;height:60px}
}
@media(max-width:768px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
  .sidebar{display:none;position:fixed;top:0;left:0;width:260px;height:100vh;height:100dvh;z-index:100;box-shadow:2px 0 24px rgba(0,0,0,.15);transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
  .sidebar.show{display:block;transform:translateX(0)}
  .main{padding:14px 16px;padding-top:env(safe-area-inset-top,14px)}
  .rightpanel{display:none;position:fixed;top:0;right:0;width:280px;height:100vh;height:100dvh;z-index:100;box-shadow:-2px 0 20px rgba(0,0,0,.15)}
  .rightpanel.show{display:block}
  .card-grid.g2{grid-template-columns:1fr}.card-grid.g3{grid-template-columns:1fr}.card-grid.g4{grid-template-columns:1fr 1fr}
  .kanban{grid-template-columns:1fr;min-height:auto}
  .bar-chart{height:80px}
  .page-header{flex-wrap:wrap}
  .page-header h1{font-size:18px}
  .page-header-actions{width:100%;margin-left:0;margin-top:8px}
  .stat .num{font-size:22px}
  .modal{width:95vw;padding:16px}
  .table-wrap{font-size:12px;-webkit-overflow-scrolling:touch}.stat{padding:14px}.stat .num{font-size:24px}
  th,td{padding:6px 8px}
  .week-grid{grid-template-columns:40px repeat(7,1fr);gap:2px}
  .week-slot{min-height:40px;font-size:9px}
  .mobile-bar{display:flex !important}
  .cal-cell{min-height:60px;padding:4px 2px}
  .tl-item .tl-actions{opacity:1 !important}
  .tl-actions{opacity:1 !important}
  .main{padding-bottom:80px}
}
.mobile-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(240,232,219,.6);padding:8px 12px;padding-bottom:calc(env(safe-area-inset-bottom,8px) + 6px);z-index:50;justify-content:space-around;box-shadow:0 -4px 24px rgba(180,150,120,.08)}
.mobile-bar .mb-btn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--text-sub);cursor:pointer;padding:4px 12px;border-radius:14px;transition:all .2s}
.mobile-bar .mb-btn.active{color:var(--accent);background:var(--accent-soft)}.mobile-bar .mb-btn.active .mb-ico{transform:scale(1.1);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.mobile-bar .mb-btn .mb-ico{font-size:20px;transition:transform .2s}.mobile-bar .mb-btn:active .mb-ico{transform:scale(.85)}
.overlay-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:99;opacity:0;transition:opacity .3s}
.overlay-mask.show{display:block;opacity:1}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">潇潇的<span>工作台</span></div>
    <div class="brand-sub" id="greeting">早上好，潇潇 ☀</div>
    <div class="nav-group">
      <div class="nav-group-title"><span class="dot" style="background:var(--accent)"></span>个人事务</div>
      <div class="nav-item active" data-module="account"><span class="ico">💰</span>记账本<span class="nav-badge" id="badge-account">0</span></div>
      <div class="nav-item" data-module="fitness"><span class="ico">🏃</span>健身打卡</div>
      <div class="nav-item" data-module="reading"><span class="ico">📖</span>阅读追踪</div>
      <div class="nav-item" data-module="study"><span class="ico">🍳</span>菜谱记录</div>
      <div class="nav-item" data-module="chores"><span class="ico">🏠</span>家务管理</div>
    </div>
    <div class="nav-group">
      <div class="nav-group-title"><span class="dot" style="background:var(--orange)"></span>自媒体运营</div>
      <div class="nav-item" data-module="kanban"><span class="ico">📋</span>内容看板<span class="nav-badge" id="badge-kanban">0</span></div>
      <div class="nav-item" data-module="analytics"><span class="ico">📊</span>数据分析</div>
      <div class="nav-item" data-module="pubcal"><span class="ico">📅</span>发布日历</div>
    </div>
    <div class="nav-group">
      <div class="nav-group-title"><span class="dot" style="background:var(--green)"></span>画室经营</div>
      <div class="nav-brand-header" style="color:var(--chuanye)"><span class="dot" style="background:var(--chuanye)"></span>川也艺术</div>
      <div class="nav-item sub" data-module="cy_students"><span class="ico">👥</span>学员综合台账<span class="nav-badge" id="badge-cy-students">0</span></div>
      <div class="nav-item sub" data-module="cy_schedule"><span class="ico">📅</span>周课程排课</div>
      <div class="nav-item sub" data-module="cy_lesson"><span class="ico">📚</span>美术教研备课</div>
      <div class="nav-item sub" data-module="cy_courseware"><span class="ico">🎨</span>课件库</div>
      <div class="nav-item sub" data-module="cy_media"><span class="ico">📱</span>自媒体运营台账</div>
      <div class="nav-item sub" data-module="cy_inventory"><span class="ico">📦</span>物料库存</div>
      <div class="nav-brand-header" style="color:var(--baishe)"><span class="dot" style="background:var(--baishe)"></span>白舍艺术</div>
      <div class="nav-item sub" data-module="bs_wanke"><span class="ico">🏫</span>万科店出勤</div>
      <div class="nav-item sub" data-module="bs_gushui"><span class="ico">🏫</span>谷水湾店出勤</div>
    </div>
  </aside>
  <main class="main" id="main"></main>
  <aside class="rightpanel" id="rightpanel"></aside>
</div>
<div class="overlay-mask" id="overlayMask" onclick="closeMobilePanels()"></div>
<div class="mobile-bar" id="mobileBar"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modal"></div></div>
<script>
/* ===== Data Layer ===== */
const DB={
  get(k,def){try{const v=localStorage.getItem('xx_'+k);return v?JSON.parse(v):def}catch(e){return def}},
  set(k,v){localStorage.setItem('xx_'+k,JSON.stringify(v))}
};
function todayStr(o=0){const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)}
function uid(){return Date.now()+Math.floor(Math.random()*1000)}
function fmtMoney(n){return n>=10000?(n/10000).toFixed(1)+'万':String(n)}
function esc(s){return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function daysUntil(ds){return Math.ceil((new Date(ds+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000)}
function platformName(p){return{xhs:'小红书',dy:'抖音',wx:'公众号',bili:'B站',other:'其他'}[p]||p}
function weekStart(o){const d=new Date();d.setDate(d.getDate()-d.getDay()+o*7);return d.toISOString().slice(0,10)}
function weekLabel(ws){const d=new Date(ws);return (d.getMonth()+1)+'月'+d.getDate()+'日'}
function getWeekNum(ws){const d=new Date(ws);const j=new Date(d.getFullYear(),0,1);return Math.ceil(((d-j)/86400000+j.getDay()+1)/7)}
function contractExpire(t){if(!t.joinDate||!t.contractMonths)return null;const j=new Date(t.joinDate);const e=new Date(j);e.setMonth(e.getMonth()+t.contractMonths);return{date:e.toISOString().slice(0,10),days:daysUntil(e.toISOString().slice(0,10))}}
function nextBirthday(bd){if(!bd)return null;const t=new Date(todayStr()+'T00:00:00');const m=+bd.slice(5,7),d=+bd.slice(8,10);let n=new Date(t.getFullYear(),m-1,d);if(n<t)n=new Date(t.getFullYear()+1,m-1,d);return{date:n.toISOString().slice(0,10),days:Math.ceil((n-t)/86400000)}}
const DAY_NAMES=['周日','周一','周二','周三','周四','周五','周六'];
const TIME_SLOTS=['9:00-10:30','10:30-12:00','14:00-15:30','15:30-17:00','18:00-19:30','19:30-21:00'];

if(!DB.get('inited')){
  DB.set('todos',[]);
  DB.set('memos',[]);
  DB.set('fitness',[]);
  DB.set('fitness_weight',[]);
  DB.set('fitness_habits',[]);
  DB.set('reading',[]);
  DB.set('study',[]);
  DB.set('recipes',[]);
  DB.set('chores',[]);
  DB.set('contents',[]);
  DB.set('cy_students',[]);
  DB.set('cy_schedule',[]);
  DB.set('cy_lessons',[]);
  DB.set('cy_courseware',{});
  DB.set('cy_media',[]);
  DB.set('cy_inventory',[]);
  DB.set('cy_purchase',[]);
  DB.set('bs_teachers',[]);
  DB.set('bs_attendance',[]);
  DB.set('accounts',[]);
  DB.set('budgets',{个人:{},工作室:{}});
  DB.set('inited',true);
  DB.set('data_version',4);
}else{
  if(DB.get('data_version')<4){
    if(!localStorage.getItem('xx_fitness_weight'))DB.set('fitness_weight',[]);
    if(!localStorage.getItem('xx_fitness_habits'))DB.set('fitness_habits',[]);
    if(!localStorage.getItem('xx_recipes'))DB.set('recipes',[]);
    DB.set('data_version',4);
  }
}

let currentModule='todo';
let cyScheduleOffset=0;
const modules={};
function switchModule(m){currentModule=m;document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.module===m));const main=document.getElementById('main');main.innerHTML='';modules[m](main);main.classList.add('fade-in');setTimeout(function(){main.classList.remove('fade-in')},300);updateBadges();updateMobileBar();}

function updateMobileBar(){
  var m=currentModule;
  var zone='personal';
  if(['kanban','analytics','pubcal'].indexOf(m)>=0)zone='media';
  else if(m.indexOf('cy_')===0)zone='chuanye';
  else if(m.indexOf('bs_')===0)zone='baishe';
  var bars={
    personal:[['☰','导航','openMobileSidebar()'],['✓','待办',"switchModule('todo')"],['📝','备忘',"switchModule('memo')"],['🔔','提醒','openMobileRight()']],
    media:[['☰','导航','openMobileSidebar()'],['📋','看板',"switchModule('kanban')"],['📊','数据',"switchModule('analytics')"],['📅','日历',"switchModule('pubcal')"]],
    chuanye:[['☰','导航','openMobileSidebar()'],['👥','学员',"switchModule('cy_students')"],['📅','排课',"switchModule('cy_schedule')"],['🎨','课件',"switchModule('cy_courseware')"]],
    baishe:[['☰','导航','openMobileSidebar()'],['🏫','万科',"switchModule('bs_wanke')"],['🏫','谷水',"switchModule('bs_gushui')"],['🔔','提醒','openMobileRight()']]
  };
  var activeMap={personal:{todo:'待办',memo:'备忘'},media:{kanban:'看板',analytics:'数据',pubcal:'日历'},chuanye:{cy_students:'学员',cy_schedule:'排课',cy_courseware:'课件'},baishe:{bs_wanke:'万科',bs_gushui:'谷水'}};
  var btns=bars[zone];
  var h='';
  btns.forEach(function(b){
    var icon=b[0],label=b[1],action=b[2];
    var isActive=activeMap[zone][m]===label;
    h+='<div class="mb-btn'+(isActive?' active':'')+'" onclick="'+action+'"><span class="mb-ico">'+icon+'</span>'+label+'</div>';
  });
  document.getElementById('mobileBar').innerHTML=h;
}
document.querySelectorAll('.nav-item').forEach(function(el){el.addEventListener('click',function(){switchModule(el.dataset.module)})});
function showModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalOverlay').classList.add('show')}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target.id==='modalOverlay')closeModal()});
/* 移动端面板控制 */
function openMobileSidebar(){document.getElementById('overlayMask').classList.add('show');document.querySelector('.sidebar').classList.add('show')}
function openMobileRight(){document.getElementById('overlayMask').classList.add('show');document.getElementById('rightpanel').classList.add('show')}
function closeMobilePanels(){document.getElementById('overlayMask').classList.remove('show');document.querySelector('.sidebar').classList.remove('show');document.getElementById('rightpanel').classList.remove('show')}
// 移动端点击导航项后自动关闭侧栏
document.querySelectorAll('.nav-item').forEach(function(el){el.addEventListener('click',function(){if(window.innerWidth<=768){closeMobilePanels()}})});
function updateBadges(){
  var el;
  if((el=document.getElementById('badge-todo')))el.textContent=DB.get('todos',[]).filter(function(t){return!t.done}).length;
  if((el=document.getElementById('badge-kanban')))el.textContent=DB.get('contents',[]).filter(function(c){return c.status!=='published'}).length;
  if((el=document.getElementById('badge-cy-students')))el.textContent=DB.get('cy_students',[]).length;
  if((el=document.getElementById('badge-account')))el.textContent=DB.get('accounts',[]).filter(function(a){return a.date.slice(0,7)===todayStr().slice(0,7)}).length;
}
function setGreeting(){var h=new Date().getHours();var g='早上好';if(h>=12)g='下午好';if(h>=18)g='晚上好';if(h>=22)g='夜深了';var w=['日','一','二','三','四','五','六'][new Date().getDay()];document.getElementById('greeting').textContent=g+'，潇潇 · 周'+w;}

function renderRightPanel(){
  var rp=document.getElementById('rightpanel');
  var todos=DB.get('todos',[]).filter(function(t){return!t.done}).sort(function(a,b){return(a.datetime||'z')>(b.datetime||'z')?1:-1}).slice(0,5);
  var bsT=DB.get('bs_teachers',[]);
  var cw=bsT.filter(function(t){var e=contractExpire(t);return e&&e.days<=30&&e.days>=-30});
  var bw=bsT.filter(function(t){var b=nextBirthday(t.birthday);return b&&b.days<=30&&b.days>=0});
  var html='<div class="rp-section"><div class="rp-title">即将到期待办 <a onclick="quickAddTodo()">+添加</a></div>';
  if(todos.length){todos.forEach(function(t){var d=t.datetime?daysUntil(t.datetime.slice(0,10)):null;var cls=d!==null&&d<0?'urgent':d!==null&&d<=1?'warn':'';html+='<div class="rp-event '+cls+'"><div class="et">'+esc(t.text)+'</div><div class="em">'+(t.datetime?new Date(t.datetime).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'无时间')+'</div></div>'})}else{html+='<div class="text-sm text-mute" style="padding:8px 0">暂无待办 🌿</div>'}
  html+='</div><div class="rp-section"><div class="rp-title">合同到期提醒</div>';
  if(cw.length){cw.forEach(function(t){var e=contractExpire(t);var cls=e.days<=7?'urgent':'warn';html+='<div class="rp-event '+cls+'"><div class="et">'+esc(t.store)+'·'+esc(t.name)+'</div><div class="em">到期：'+e.date+'('+(e.days>0?'还剩'+e.days+'天':'已过期'+(-e.days)+'天')+')</div></div>'})}else{html+='<div class="text-sm text-mute" style="padding:8px 0">暂无到期提醒</div>'}
  html+='</div><div class="rp-section"><div class="rp-title">生日提醒</div>';
  if(bw.length){bw.forEach(function(t){var b=nextBirthday(t.birthday);html+='<div class="rp-event warn"><div class="et">🎂 '+esc(t.store)+'·'+esc(t.name)+'</div><div class="em">生日：'+t.birthday.slice(5)+'（还有'+b.days+'天）</div></div>'})}else{html+='<div class="text-sm text-mute" style="padding:8px 0">暂无生日提醒</div>'}
  html+='</div><div class="rp-section"><div class="rp-title">快速备忘</div><div class="quick-add"><input class="input" id="quickMemo" placeholder="想到什么记下来..." onkeydown="if(event.key===\'Enter\')quickMemo()"><button class="btn btn-primary btn-sm" onclick="quickMemo()">记</button></div></div>';
  rp.innerHTML=html;
}

/* ========== 个人事务 ========== */
modules.todo=function(main){
  var todos=DB.get('todos',[]).filter(function(t){return!t.done}).sort(function(a,b){return(a.datetime||'z')>(b.datetime||'z')?1:-1});
  var done=DB.get('todos',[]).filter(function(t){return t.done}).slice(-10).reverse();
  var ov=todos.filter(function(t){return t.datetime&&daysUntil(t.datetime.slice(0,10))<0});
  var td=todos.filter(function(t){return t.datetime&&daysUntil(t.datetime.slice(0,10))===0});
  var h='<div class="page-header"><div><h1>待办提醒</h1><div class="sub">到点提醒 · 不错过每一件重要事</div></div><div class="page-header-actions"><button class="btn btn-primary" onclick="todoModal()">+ 新建待办</button></div></div>';
  if(ov.length)h+='<div class="alert-banner urgent"><span class="alert-icon">⚠️</span><div><strong>'+ov.length+'条待办已逾期</strong> · '+ov.map(function(t){return esc(t.text)}).join('、')+'</div></div>';
  if(td.length)h+='<div class="alert-banner"><span class="alert-icon">📌</span><div><strong>今日待办'+td.length+'项</strong> · '+td.map(function(t){return esc(t.text)}).join('、')+'</div></div>';
  h+='<div class="card-grid g2"><div class="card"><div class="card-title flex-between">待办事项 <span class="text-sm text-mute">'+todos.length+'项未完成</span></div>';
  if(todos.length){
    h+='<div class="timeline">';
    todos.forEach(function(t){
      var d=t.datetime?daysUntil(t.datetime.slice(0,10)):null;
      var cls=d!==null&&d<0?'overdue':d===0?'':'';
      var dt=t.datetime?new Date(t.datetime).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'未设时间';
      var dl=d!==null?(d<0?'逾期'+(-d)+'天':d===0?'今天':'还有'+d+'天'):'';
      h+='<div class="tl-item '+cls+'"><div class="tl-time">'+dt+(dl?' · '+dl:'')+'</div><div class="tl-text">'+esc(t.text)+'</div>';
      if(t.note)h+='<div class="tl-note">'+esc(t.note)+'</div>';
      h+='<div class="tl-actions"><button class="btn btn-sm" onclick="toggleTodo('+t.id+')">✓完成</button><button class="btn btn-sm" onclick="todoModal('+t.id+')">编辑</button><button class="btn btn-sm btn-danger" onclick="delTodo('+t.id+')">删除</button></div></div>';
    });
    h+='</div>';
  }else{h+='<div class="empty"><div class="big">🎯</div>暂无待办，享受生活</div>'}
  h+='</div><div class="card"><div class="card-title flex-between">备忘速记 <a class="text-sm" style="color:var(--accent);cursor:pointer" onclick="memoModal()">+记一条</a></div><div id="memoList">'+renderMemoInline()+'</div></div></div>';
  if(done.length){h+='<div class="card mt"><div class="card-title">已完成('+done.length+')</div>';done.forEach(function(t){h+='<div class="rp-todo done"><div class="mini-check done"></div><span class="t">'+esc(t.text)+'</span></div>'});h+='</div>'}
  main.innerHTML=h;
};
function renderMemoInline(){var ms=DB.get('memos',[]).sort(function(a,b){return b.created-a.created}).slice(0,8);if(!ms.length)return'<div class="empty"><div class="big">📝</div>暂无备忘</div>';return ms.map(function(m){return'<div style="padding:8px 0;border-bottom:1px solid var(--border)"><div class="text-sm" style="white-space:pre-wrap;word-break:break-all">'+esc(m.text)+'</div><div class="flex-between mt2"><span class="text-xs text-mute">'+new Date(m.created).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+'</span><span class="del-x" onclick="delMemo('+m.id+')">×</span></div></div>'}).join('')}
function toggleTodo(id){var ts=DB.get('todos',[]);var t=ts.find(function(x){return x.id===id});t.done=!t.done;DB.set('todos',ts);switchModule('todo');renderRightPanel();}
function delTodo(id){DB.set('todos',DB.get('todos',[]).filter(function(t){return t.id!==id}));switchModule('todo');renderRightPanel();}
function todoModal(id){var t=id?DB.get('todos',[]).find(function(x){return x.id===id}):null;var dt=t&&t.datetime?t.datetime.slice(0,16):todayStr()+'T09:00';showModal('<h2>'+(t?'编辑待办':'新建待办')+'</h2><div class="modal-row"><label>事项内容</label><input class="input" id="m_todo_text" value="'+(t?esc(t.text):'')+'"></div><div class="modal-row"><label>提醒时间</label><input class="input" type="datetime-local" id="m_todo_dt" value="'+dt+'"></div><div class="modal-row"><label>备注</label><input class="input" id="m_todo_note" value="'+(t?esc(t.note||''):'' )+'"></div><div class="modal-actions">'+(t?'<button class="btn btn-danger" style="margin-right:auto" onclick="delTodo('+t.id+');closeModal()">删除</button>':'')+'<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveTodo('+(t?t.id:0)+')">保存</button></div>');}

modules.fitness=function(main){var r=DB.get('fitness',[]);var wd=[];for(var i=6;i>=0;i--){var d=todayStr(-i),rs=r.filter(function(x){return x.date===d});wd.push({date:d,mins:rs.reduce(function(s,x){return s+x.duration},0),cals:rs.reduce(function(s,x){return s+x.calories},0)})}var tm=wd.reduce(function(s,d){return s+d.mins},0),tc=wd.reduce(function(s,d){return s+d.cals},0),ad=wd.filter(function(d){return d.mins>0}).length,mm=Math.max.apply(null,wd.map(function(d){return d.mins}).concat([1]));var weights=DB.get('fitness_weight',[]).sort(function(a,b){return a.date<b.date?-1:1});var habits=DB.get('fitness_habits',[]);var todayHabit={'清淡饮食':habits.some(function(h){return h.date===todayStr()&&h.type==='清淡饮食'}),'戒糖':habits.some(function(h){return h.date===todayStr()&&h.type==='戒糖'})};var dietStreak=calcHabitStreak(habits,'清淡饮食');var sugarStreak=calcHabitStreak(habits,'戒糖');main.innerHTML='<div class="page-header"><div><h1>健身打卡</h1><div class="sub">坚持运动，保持活力</div></div><div class="page-header-actions"><button class="btn" onclick="weightModal()">⚖️ 体重</button><button class="btn btn-primary" onclick="fitnessModal()">+ 打卡</button></div></div><div class="card-grid g4 mb"><div class="stat"><div class="label">本周时长</div><div class="num">'+tm+'<small>分钟</small></div></div><div class="stat"><div class="label">本周消耗</div><div class="num">'+tc+'<small>千卡</small></div></div><div class="stat"><div class="label">本周打卡</div><div class="num">'+ad+'<small>/7天</small></div></div><div class="stat"><div class="label">总记录</div><div class="num">'+r.length+'</div></div></div><div class="card-grid g2 mb"><div class="card"><div class="card-title">本周运动量</div><div class="bar-chart">'+wd.map(function(d){return'<div class="bar-col"><div class="bar" style="height:'+d.mins/mm*100+'%"></div><div class="bar-label">'+(new Date(d.date).getMonth()+1)+'/'+new Date(d.date).getDate()+'</div></div>'}).join('')+'</div></div><div class="card"><div class="card-title flex-between">体重变化 '+(weights.length?'<span class="text-sm text-sub">'+weights[weights.length-1].weight+'kg</span>':'')+'</div>'+(weights.length?renderWeightChart(weights):'<div class="empty"><div class="big">⚖️</div>点击"体重"开始记录</div>')+'</div></div><div class="card mb"><div class="card-title">每日习惯打卡</div><div class="habit-card"><div class="h-info"><span class="h-icon">🥗</span><div><div class="h-name">清淡饮食</div><div class="h-streak">连续'+dietStreak+'天</div></div></div><button class="habit-btn'+(todayHabit['清淡饮食']?' done':'')+'" onclick="toggleHabit(\'清淡饮食\')">'+(todayHabit['清淡饮食']?'✓ 今日已打卡':'今日打卡')+'</button></div><div class="habit-card"><div class="h-info"><span class="h-icon">🚫</span><div><div class="h-name">戒糖打卡</div><div class="h-streak">连续'+sugarStreak+'天</div></div></div><button class="habit-btn'+(todayHabit['戒糖']?' done':'')+'" onclick="toggleHabit(\'戒糖\')">'+(todayHabit['戒糖']?'✓ 今日已打卡':'今日打卡')+'</button></div></div><div class="card"><div class="card-title">运动记录</div><div class="table-wrap"><table><thead><tr><th>日期</th><th>类型</th><th>时长</th><th>消耗</th><th>备注</th><th></th></tr></thead><tbody>'+(r.slice(-20).reverse().map(function(x){return'<tr><td>'+x.date+'</td><td><strong>'+esc(x.type)+'</strong></td><td>'+x.duration+'分钟</td><td>'+x.calories+'千卡</td><td class="text-sub">'+esc(x.note||'')+'</td><td><span class="del-x" onclick="delFitness('+x.id+')">×</span></td></tr>'}).join('')||'<tr><td colspan="6" class="empty"><div class="big">🏃</div>开始第一次打卡</td></tr>')+'</tbody></table></div></div>'};
function renderWeightChart(weights){var recent=weights.slice(-30);if(recent.length<1)return'<div class="empty"><div class="big">⚖️</div>至少记录1次体重</div>';var w=300,h=140,pad=25;var vals=recent.map(function(wt){return wt.weight});var minV=Math.min.apply(null,vals)-1,maxV=Math.max.apply(null,vals)+1;var range=maxV-minV||1;var pts=recent.map(function(wt,i){var x=pad+(recent.length===1?(w-pad*2)/2:i/(recent.length-1)*(w-pad*2));var y=h-pad-(wt.weight-minV)/range*(h-pad*2);return{x:x,y:y,val:wt.weight,date:wt.date}});var path=pts.map(function(p,i){return(i===0?'M':'L')+p.x+','+p.y}).join(' ');var dots=pts.map(function(p){return'<circle cx="'+p.x+'" cy="'+p.y+'" r="3" fill="var(--accent)"><title>'+p.date+': '+p.val+'kg</title></circle>'}).join('');var labels=recent.length<=10?pts.map(function(p){var d=new Date(p.date);return'<text x="'+p.x+'" y="'+(h-4)+'" text-anchor="middle" font-size="8" fill="var(--text-mute)">'+(d.getMonth()+1)+'/'+d.getDate()+'</text>'}).join(''):'';return'<div class="weight-chart-box"><svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>'+dots+labels+'</svg></div>'}
function calcHabitStreak(habits,type){var sorted=habits.filter(function(h){return h.type===type}).sort(function(a,b){return a.date<b.date?1:-1});var streak=0;var d=todayStr();for(var i=0;i<sorted.length;i++){if(sorted[i].date===d){streak++;d=todayStr(-streak)}else break}return streak}
function toggleHabit(type){var habits=DB.get('fitness_habits',[]);var today=todayStr();var idx=habits.findIndex(function(h){return h.date===today&&h.type===type});if(idx>=0){habits.splice(idx,1)}else{habits.push({id:uid(),date:today,type:type})}DB.set('fitness_habits',habits);switchModule('fitness')}
function fitnessModal(){showModal('<h2>健身打卡</h2><div class="modal-row"><label>日期</label><input class="input" type="date" id="m_fd" value="'+todayStr()+'"></div><div class="modal-row"><label>类型</label><select class="input" id="m_ft"><option>跑步</option><option>瑜伽</option><option>力量训练</option><option>游泳</option><option>骑行</option><option>HIIT</option><option>其他</option></select></div><div class="modal-row"><label>时长(分钟)</label><input class="input" type="number" id="m_fdur" value="30"></div><div class="modal-row"><label>消耗(千卡)</label><input class="input" type="number" id="m_fcal" value="200"></div><div class="modal-row"><label>备注</label><input class="input" id="m_fn"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveFitness()">打卡</button></div>');}
function saveFitness(){var r=DB.get('fitness',[]);r.push({id:uid(),date:document.getElementById('m_fd').value,type:document.getElementById('m_ft').value,duration:+document.getElementById('m_fdur').value,calories:+document.getElementById('m_fcal').value,note:document.getElementById('m_fn').value});DB.set('fitness',r);closeModal();switchModule('fitness');}
function delFitness(id){DB.set('fitness',DB.get('fitness',[]).filter(function(x){return x.id!==id}));switchModule('fitness');}
function weightModal(){var weights=DB.get('fitness_weight',[]);var last=weights.length?weights[weights.length-1].weight:'';showModal('<h2>记录体重</h2><div class="modal-row"><label>日期</label><input class="input" type="date" id="m_wd" value="'+todayStr()+'"></div><div class="modal-row"><label>体重(kg)</label><input class="input" type="number" step="0.1" id="m_wv" value="'+last+'" placeholder="如 55.5"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveWeight()">保存</button></div>');}
function saveWeight(){var w=DB.get('fitness_weight',[]);var date=document.getElementById('m_wd').value;var weight=+document.getElementById('m_wv').value;if(!weight){alert('请输入体重');return}var existing=w.find(function(x){return x.date===date});if(existing){existing.weight=weight}else{w.push({id:uid(),date:date,weight:weight})}DB.set('fitness_weight',w);closeModal();switchModule('fitness');}

modules.reading=function(main){var b=DB.get('reading',[]);main.innerHTML='<div class="page-header"><div><h1>阅读追踪</h1><div class="sub">在读'+b.filter(function(x){return x.status==='reading'}).length+'本 · 已读'+b.filter(function(x){return x.status==='done'}).length+'本</div></div><div class="page-header-actions"><button class="btn btn-primary" onclick="bookModal()">+添加书目</button></div></div><div class="card-grid g2">'+(b.length?b.map(function(x){var p=Math.round(x.read/x.total*100);return'<div class="card"><div class="flex-between mb2"><div><strong>'+esc(x.title)+'</strong><div class="text-sm text-sub">'+esc(x.author)+'</div></div><span class="chip" style="'+(x.status==='done'?'background:#e8f7ef;color:#2bb673':'')+'">'+(x.status==='done'?'已读完':'在读')+'</span></div><div class="flex-between text-sm"><span class="text-sub">'+x.read+'/'+x.total+'页</span><span class="text-sub">'+p+'%</span></div><div class="progress"><div class="progress-bar '+(p>=80?'green':p>=40?'':'orange')+'" style="width:'+p+'%"></div></div>'+(x.note?'<div class="text-sm text-sub mt2">📝'+esc(x.note)+'</div>':'')+'<div class="flex mt2"><button class="btn btn-sm" onclick="updProg('+x.id+')">更新进度</button><button class="btn btn-sm" onclick="finBook('+x.id+')" '+(x.status==='done'?'disabled':'')+'>标记读完</button><button class="btn-icon" onclick="delBook('+x.id+')" style="margin-left:auto">🗑</button></div></div>'}).join(''):'<div class="empty"><div class="big">📚</div>书架空空如也</div>')+'</div>'};

function saveBook(){var b=DB.get('reading',[]);var rd=+document.getElementById('m_brd').value,tot=+document.getElementById('m_btot').value;b.push({id:uid(),title:document.getElementById('m_bt').value,author:document.getElementById('m_ba').value,total:tot,read:rd,status:rd>=tot?'done':'reading',note:document.getElementById('m_bn').value});DB.set('reading',b);closeModal();switchModule('reading');}
function updProg(id){var b=DB.get('reading',[]);var x=b.find(function(v){return v.id===id});var n=+prompt('更新《'+x.title+'》已读页数（当前'+x.read+'/'+x.total+'）：',x.read);if(!isNaN(n)){x.read=n;if(n>=x.total)x.status='done';DB.set('reading',b);switchModule('reading');}}

modules.study=function(main){var rs=DB.get('recipes',[]).sort(function(a,b){return b.created-a.created});main.innerHTML='<div class="page-header"><div><h1>菜谱记录</h1><div class="sub">收藏你的拿手好菜</div></div><div class="page-header-actions"><button class="btn btn-primary" onclick="recipeModal()">+ 添加菜谱</button></div></div>'+(rs.length?'<div class="recipe-grid">'+rs.map(function(r){return'<div class="recipe-card" onclick="recipeModal('+r.id+')"><div class="recipe-cover">'+(r.image?'<img src="'+r.image+'">':'🍽️')+'</div><div class="recipe-info"><div class="recipe-name">'+esc(r.name)+'</div><div class="recipe-preview">'+esc(r.ingredients?r.ingredients.split(String.fromCharCode(10))[0]:'点击查看详情')+'</div></div></div>'}).join('')+'</div>':'<div class="empty"><div class="big">🍳</div>还没有菜谱，点击添加</div>')};
function recipeModal(id){var r=id?DB.get('recipes',[]).find(function(x){return x.id===id}):null;showModal('<h2>'+(r?'编辑菜谱':'添加菜谱')+'</h2><div class="modal-row"><label>菜名</label><input class="input" id="m_r_name" value="'+(r?esc(r.name):'')+'" placeholder="如：番茄炒蛋"></div><div class="modal-row"><label>封面图片</label><input type="file" accept="image/*" id="m_r_img" style="display:none" onchange="recipeImgChange(this)">'+(r&&r.image?'<div class="cw-img-preview mb2"><div class="cw-thumb-wrap"><img src="'+r.image+'" class="cw-thumb"></div></div>':'')+'<button class="btn btn-sm" onclick="document.getElementById(\'m_r_img\').click()">📷 上传图片</button><div id="m_r_img_preview" class="cw-img-preview mt2"></div></div><div class="modal-row"><label>准备材料</label><textarea class="input" id="m_r_ing" rows="4" style="font-size:12px;line-height:1.8" placeholder="鸡蛋3个&#10;番茄2个&#10;盐适量">'+(r?esc(r.ingredients||''):'')+'</textarea></div><div class="modal-row"><label>具体步骤</label><textarea class="input" id="m_r_steps" rows="8" style="font-size:12px;line-height:1.8" placeholder="1. 鸡蛋打散，番茄切块&#10;2. 热锅下油，炒蛋盛出&#10;3. 锅中放番茄炒出汁&#10;4. 倒入鸡蛋翻炒，加盐调味">'+(r?esc(r.steps||''):'')+'</textarea></div><div class="modal-actions">'+(r?'<button class="btn btn-danger" style="margin-right:auto" onclick="delRecipe('+r.id+')">删除</button>':'')+'<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveRecipe('+(r?r.id:0)+')">保存</button></div>');}
function recipeImgChange(input){var file=input.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(e){var img=new Image();img.onload=function(){var canvas=document.createElement('canvas');var maxW=400;var w=img.width,h=img.height;if(w>maxW){h=h*maxW/w;w=maxW}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);var dataUrl=canvas.toDataURL('image/jpeg',0.7);window._recipeImg=dataUrl;var pv=document.getElementById('m_r_img_preview');pv.innerHTML='<div class="cw-thumb-wrap"><img src="'+dataUrl+'" class="cw-thumb"></div>'};img.src=e.target.result};reader.readAsDataURL(file)}
function saveRecipe(id){var name=document.getElementById('m_r_name').value.trim();if(!name){alert('请输入菜名');return}var rs=DB.get('recipes',[]);var img=window._recipeImg||'';if(id){var r=rs.find(function(x){return x.id===id});r.name=name;r.ingredients=document.getElementById('m_r_ing').value;r.steps=document.getElementById('m_r_steps').value;if(img)r.image=img}else{rs.push({id:uid(),name:name,image:img,ingredients:document.getElementById('m_r_ing').value,steps:document.getElementById('m_r_steps').value,created:Date.now()})}DB.set('recipes',rs);window._recipeImg=null;closeModal();switchModule('study');}
function delRecipe(id){DB.set('recipes',DB.get('recipes',[]).filter(function(r){return r.id!==id}));closeModal();switchModule('study');}

modules.chores=function(main){var c=DB.get('chores',[]);main.innerHTML='<div class="page-header"><div><h1>家务管理</h1><div class="sub">分工明确，轻松持家</div></div><div class="page-header-actions"><button class="btn btn-primary" onclick="choreModal()">+添加家务</button></div></div><div class="card"><div class="table-wrap"><table><thead><tr><th>家务</th><th>负责人</th><th>周期</th><th>上次完成</th><th>下次提醒</th><th>状态</th><th></th></tr></thead><tbody>'+(c.map(function(x){var od=new Date(x.next)<=new Date();var cycDesc=typeof x.cycle==='object'?'每月'+x.cycle.days.join('、')+'号':esc(x.cycle);return'<tr><td><strong>'+esc(x.task)+'</strong></td><td><span class="chip">'+esc(x.assignee)+'</span></td><td>'+cycDesc+'</td><td>'+x.lastDone+'</td><td class="'+(od?'text-red':'')+'">'+x.next+(od?' ⚠️':'')+'</td><td>'+(od?'<span class="chip" style="background:#ffeaea;color:#ff5a5a">逾期</span>':'<span class="chip" style="background:#e8f7ef;color:#2bb673">正常</span>')+'</td><td><button class="btn btn-sm" onclick="doneChore('+x.id+')">完成</button> <span class="del-x" onclick="delChore('+x.id+')">×</span></td></tr>'}).join('')||'<tr><td colspan="7" class="empty"><div class="big">🏠</div>暂无家务安排</td></tr>')+'</tbody></table></div></div>'};
function choreModal(){showModal('<h2>添加家务</h2><div class="modal-row"><label>家务事项</label><input class="input" id="m_ct"></div><div class="modal-row"><label>负责人</label><input class="input" id="m_cw"></div><div class="modal-row"><label>周期</label><select class="input" id="m_cc" onchange="var d=document.getElementById(\'m_cc_days_wrap\');d.style.display=this.value===\'每月指定日期\'?\'block\':\'none\'"><option>每天</option><option>每周</option><option>每两周</option><option>每月</option><option value="每月指定日期">每月指定日期</option></select></div><div class="modal-row" id="m_cc_days_wrap" style="display:none"><label>每月几号（多个用逗号分隔）</label><input class="input" id="m_cc_days" placeholder="如：1,15,28"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveChore()">添加</button></div>');}
function calcNextDate(cycle){if(typeof cycle==='object'&&cycle.type==='monthly'){var days=cycle.days;var today=new Date();var d=today.getDate();for(var i=1;i<=31;i++){var next=new Date(today);next.setDate(today.getDate()+i);if(days.indexOf(next.getDate())>=0){return next.toISOString().slice(0,10)}}return todayStr(30)}var dy={每天:1,每周:7,'每两周':14,每月:30}[cycle];return todayStr(dy||1)}
function saveChore(){var c=DB.get('chores',[]);var cyVal=document.getElementById('m_cc').value;var cycle;if(cyVal==='每月指定日期'){var daysStr=document.getElementById('m_cc_days').value;var days=daysStr.split(/[,，、\s]+/).map(function(d){return parseInt(d)}).filter(function(d){return d>=1&&d<=31});if(!days.length){alert('请输入有效的日期号(1-31)');return}cycle={type:'monthly',days:days}}else{cycle=cyVal}c.push({id:uid(),task:document.getElementById('m_ct').value,assignee:document.getElementById('m_cw').value,cycle:cycle,lastDone:todayStr(),next:calcNextDate(cycle)});DB.set('chores',c);closeModal();switchModule('chores');}
function doneChore(id){var c=DB.get('chores',[]);var x=c.find(function(v){return v.id===id});x.lastDone=todayStr();x.next=calcNextDate(x.cycle);DB.set('chores',c);switchModule('chores');}
function delChore(id){DB.set('chores',DB.get('chores',[]).filter(function(x){return x.id!==id}));switchModule('chores');}

/* ========== 记账本 ========== */
var accFilters={account:'all',type:'all',month:todayStr().slice(0,7)};
var EXP_CATS=['餐饮','交通','购物','日用','娱乐','医疗','住房','其他'];
var INC_CATS=['工资','课时费','兼职','投资','红包','其他'];
var STU_EXP_CATS=['材料采购','房租','教师工资','水电','营销','其他'];
var STU_INC_CATS=['课时费','画材销售','体验课','其他'];
var CAT_ICONS={'餐饮':'🍜','交通':'🚇','购物':'🛍','日用':'🧴','娱乐':'🎮','医疗':'💊','住房':'🏠','其他':'•','工资':'💰','课时费':'🎨','兼职':'✏','投资':'📈','红包':'🧧','材料采购':'📦','房租':'🏢','教师工资':'👤','水电':'💡','营销':'📢','画材销售':'🖌','体验课':'🎯'};

modules.account=function(main){
  var all=DB.get('accounts',[]);
  var budgets=DB.get('budgets',{个人:{},工作室:{}});
  var month=accFilters.month;
  var monthData=all.filter(function(a){return a.date.slice(0,7)===month});
  if(accFilters.account!=='all')monthData=monthData.filter(function(a){return a.account===accFilters.account});
  if(accFilters.type!=='all')monthData=monthData.filter(function(a){return a.type===accFilters.type});
  var income=monthData.filter(function(a){return a.type==='income'}).reduce(function(s,a){return s+a.amount},0);
  var expense=monthData.filter(function(a){return a.type==='expense'}).reduce(function(s,a){return s+a.amount},0);
  var balance=income-expense;
  // 按账户分别统计
  var perAcct={};
  ['个人','工作室'].forEach(function(ac){
    var d=all.filter(function(a){return a.date.slice(0,7)===month&&a.account===ac});
    perAcct[ac]={income:d.filter(function(a){return a.type==='income'}).reduce(function(s,a){return s+a.amount},0),expense:d.filter(function(a){return a.type==='expense'}).reduce(function(s,a){return s+a.amount},0)};
  });
  // 分类统计
  var catData={};
  monthData.filter(function(a){return a.type==='expense'}).forEach(function(a){catData[a.category]=(catData[a.category]||0)+a.amount});
  var catArr=Object.entries(catData).sort(function(a,b){return b[1]-a[1]});
  var maxCat=Math.max.apply(null,catArr.map(function(c){return c[1]}).concat([1]));

  var html='<div class="page-header"><div><h1>记账本</h1><div class="sub">个人 + 工作室 · 双账户管理</div></div><div class="page-header-actions"><button class="btn" onclick="budgetModal()">预算</button><button class="btn btn-primary" onclick="accountModal()">+ 记一笔</button></div></div>';

  // 月份选择器
  html+='<div class="flex mb"><input class="input" type="month" id="acc_month" value="'+month+'" style="width:160px" onchange="accFilters.month=this.value;switchModule(\'account\')"><select class="input" style="width:120px" onchange="accFilters.account=this.value;switchModule(\'account\')"><option value="all" '+(accFilters.account==='all'?'selected':'')+'>全部账户</option><option value="个人" '+(accFilters.account==='个人'?'selected':'')+'>个人</option><option value="工作室" '+(accFilters.account==='工作室'?'selected':'')+'>工作室</option></select><select class="input" style="width:100px" onchange="accFilters.type=this.value;switchModule(\'account\')"><option value="all" '+(accFilters.type==='all'?'selected':'')+'>全部</option><option value="income" '+(accFilters.type==='income'?'selected':'')+'>收入</option><option value="expense" '+(accFilters.type==='expense'?'selected':'')+'>支出</option></select></div>';

  // 统计卡片
  html+='<div class="card-grid g4 mb"><div class="stat" style="--gc:var(--grad-green)"><div class="label">本月收入</div><div class="num text-green">¥'+fmtMoney(income)+'</div></div><div class="stat"><div class="label">本月支出</div><div class="num text-red">¥'+fmtMoney(expense)+'</div></div><div class="stat"><div class="label">本月结余</div><div class="num '+(balance>=0?'text-green':'text-red')+'">¥'+fmtMoney(balance)+'</div></div><div class="stat"><div class="label">记录笔数</div><div class="num">'+monthData.length+'</div></div></div>';

  // 账户分栏
  html+='<div class="card-grid g2 mb"><div class="card" style="--gc:var(--grad-blue)"><div class="card-title"><span style="display:inline-block;width:24px;height:24px;background:#eef1ff;color:#4f6ef7;border-radius:50%;text-align:center;line-height:24px;margin-right:6px;font-size:12px">个</span>个人账户</div><div class="flex-between text-sm mb2"><span class="text-sub">收入</span><span class="text-green">¥'+fmtMoney(perAcct['个人'].income)+'</span></div><div class="flex-between text-sm mb2"><span class="text-sub">支出</span><span class="text-red">¥'+fmtMoney(perAcct['个人'].expense)+'</span></div><div class="flex-between text-sm"><span class="text-sub">结余</span><span class="' + (perAcct['个人'].income-perAcct['个人'].expense>=0?'text-green':'text-red')+'"><strong>¥'+fmtMoney(perAcct['个人'].income-perAcct['个人'].expense)+'</strong></span></div></div><div class="card" style="--gc:var(--grad-purple)"><div class="card-title"><span style="display:inline-block;width:24px;height:24px;background:#f0edff;color:#6c5ce7;border-radius:50%;text-align:center;line-height:24px;margin-right:6px;font-size:12px">画</span>工作室账户</div><div class="flex-between text-sm mb2"><span class="text-sub">收入</span><span class="text-green">¥'+fmtMoney(perAcct['工作室'].income)+'</span></div><div class="flex-between text-sm mb2"><span class="text-sub">支出</span><span class="text-red">¥'+fmtMoney(perAcct['工作室'].expense)+'</span></div><div class="flex-between text-sm"><span class="text-sub">结余</span><span class="'+(perAcct['工作室'].income-perAcct['工作室'].expense>=0?'text-green':'text-red')+'"><strong>¥'+fmtMoney(perAcct['工作室'].income-perAcct['工作室'].expense)+'</strong></span></div></div></div>';

  // 预算进度 + 分类排行
  html+='<div class="card-grid g2 mb">';
  // 预算
  var budAcct=accFilters.account==='all'?'个人':accFilters.account;
  var bud=budgets[budAcct]||{};
  var budTotal=Object.values(bud).reduce(function(s,v){return s+v},0);
  var budUsed=Object.entries(bud).map(function(kv){return catData[kv[0]]||0}).reduce(function(s,v){return s+v},0);
  html+='<div class="card"><div class="card-title flex-between">预算执行 ('+budAcct+') <button class="btn btn-sm" onclick="budgetModal()">设置</button></div>'+(budTotal>0?'<div class="flex-between text-sm mb2"><span class="text-sub">总预算 ¥'+budTotal+' / 已用 ¥'+budUsed+'</span><span class="'+(budUsed/budTotal>0.9?'text-red':budUsed/budTotal>0.7?'text-orange':'text-green')+'">'+Math.round(budUsed/budTotal*100)+'%</span></div><div class="progress mb2"><div class="progress-bar '+(budUsed/budTotal>0.9?'red':budUsed/budTotal>0.7?'orange':'')+'" style="width:'+Math.min(budUsed/budTotal*100,100)+'%"></div></div>':'<div class="text-sm text-mute" style="padding:8px 0">未设置预算，点击右上角设置</div>');
  Object.entries(bud).forEach(function(kv){
    var used=catData[kv[0]]||0;var pct=kv[1]?Math.round(used/kv[1]*100):0;
    html+='<div class="flex-between text-xs mb2"><span>'+esc(kv[0])+'</span><span class="text-sub">¥'+used+'/¥'+kv[1]+' ('+pct+'%)</span></div><div class="progress mb2"><div class="progress-bar '+(pct>90?'red':pct>70?'orange':'green')+'" style="width:'+Math.min(pct,100)+'%"></div></div>';
  });
  html+='</div>';
  // 分类排行
  html+='<div class="card"><div class="card-title">支出分类排行</div>'+(catArr.length?catArr.map(function(c,i){return'<div class="flex-between mb2"><div style="flex:1">'+(CAT_ICONS[c[0]]||'📝')+' <span class="text-mute">'+(i+1)+'.</span> '+esc(c[0])+'</div>'+'<span class="text-sm text-sub">¥'+fmtMoney(c[1])+' ('+Math.round(c[1]/expense*100)+'%)</span></div><div class="progress mb2"><div class="progress-bar" style="width:'+c[1]/maxCat*100+'%;background:['+['#4f6ef7','#2bb673','#f5a623','#ff5a5a','#9b59b6','#00a085','#6c5ce7','#e84393'][i%8]+']"></div></div>'}).join(''):'<div class="empty"><div class="big">📊</div>本月暂无支出</div>')+'</div>';
  html+='</div>';

  // 流水明细
  var sorted=monthData.sort(function(a,b){return a.date<b.date?1:-1});
  html+='<div class="card"><div class="card-title flex-between">收支流水 <span class="text-sm text-mute">'+monthData.length+'笔</span></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>账户</th><th>类型</th><th>分类</th><th>金额</th><th>备注</th><th></th></tr></thead><tbody>'+(sorted.map(function(a){return'<tr><td class="text-sm">'+a.date+'</td><td>'+(CAT_ICONS[a.category]||'📝')+'</td><td><span class="chip" style="'+(a.account==='个人'?'background:#eef1ff;color:#4f6ef7':'background:#f0edff;color:#6c5ce7')+'">'+esc(a.account)+'</span></td><td>'+(a.type==='income'?'<span class="chip" style="background:#e8f7ef;color:#2bb673">收入</span>':'<span class="chip" style="background:#ffeaea;color:#ff5a5a">支出</span>')+'</td><td>'+esc(a.category)+'</td><td class="'+(a.type==='income'?'text-green':'text-red')+'"><strong>'+(a.type==='income'?'+':'-')+'¥'+a.amount+'</strong></td><td class="text-sm text-sub">'+esc(a.note||'')+'</td><td><button class="btn-icon" onclick="accountModal('+a.id+')">✎</button> <span class="del-x" onclick="delAccount('+a.id+')">×</span></td></tr>'}).join('')||'<tr><td colspan="8" class="empty"><div class="big">💰</div>本月暂无记录，点击右上角记一笔</td></tr>')+'</tbody></table></div></div>';

  main.innerHTML=html;
};

function accountModal(id){
  var a=id?DB.get('accounts',[]).find(function(x){return x.id===id}):null;
  var isExp=a?a.type==='expense':true;
  var ac=a?a.account:'个人';
  var cats=ac==='工作室'?(isExp?STU_EXP_CATS:STU_INC_CATS):EXP_CATS.concat(INC_CATS);
  showModal('<h2>'+(a?'编辑记录':'记一笔')+'</h2><div class="modal-row"><label>账户</label><select class="input" id="m_a_acct" onchange="updateAccCats()"><option value="个人" '+(ac==='个人'?'selected':'')+'>👤 个人</option><option value="工作室" '+(ac==='工作室'?'selected':'')+'>🎨 工作室</option></select></div><div class="modal-row"><label>类型</label><div class="pri-btns"><div class="pri-btn '+(isExp?'':'active')+'" data-val="income" onclick="accSelectType(this)">收入</div><div class="pri-btn '+(isExp?'active':'')+'" data-val="expense" onclick="accSelectType(this)">支出</div></div></div><div class="modal-row"><label>分类</label><select class="input" id="m_a_cat">'+cats.map(function(c){return'<option '+(a&&a.category===c?'selected':'')+'>'+c+'</option>'}).join('')+'</select></div><div class="modal-row"><label>金额</label><input class="input" type="number" id="m_a_amt" value="'+(a?a.amount:'')+'" placeholder="0.00"></div><div class="modal-row"><label>日期</label><input class="input" type="date" id="m_a_date" value="'+(a?a.date:todayStr())+'"></div><div class="modal-row"><label>备注</label><input class="input" id="m_a_note" value="'+(a?esc(a.note||''):'' )+'" placeholder="补充说明"></div><div class="modal-actions">'+(a?'<button class="btn btn-danger" style="margin-right:auto" onclick="delAccount('+a.id+')">删除</button>':'')+'<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveAccount('+(a?a.id:0)+')">保存</button></div>');
}
var accSelType='expense';
function accSelectType(el){document.querySelectorAll('.pri-btn').forEach(function(b){b.classList.remove('active')});el.classList.add('active');accSelType=el.dataset.val;updateAccCats();}
function updateAccCats(){var ac=document.getElementById('m_a_acct').value;var cats=ac==='工作室'?(accSelType==='expense'?STU_EXP_CATS:STU_INC_CATS):(accSelType==='expense'?EXP_CATS:INC_CATS);var sel=document.getElementById('m_a_cat');sel.innerHTML=cats.map(function(c){return'<option>'+c+'</option>'}).join('');}
function saveAccount(id){var amt=+document.getElementById('m_a_amt').value;if(!amt)return;var accounts=DB.get('accounts',[]);var d={account:document.getElementById('m_a_acct').value,type:accSelType,category:document.getElementById('m_a_cat').value,amount:amt,date:document.getElementById('m_a_date').value,note:document.getElementById('m_a_note').value};if(id){Object.assign(accounts.find(function(x){return x.id===id}),d)}else{accounts.push(Object.assign({id:uid()},d))}DB.set('accounts',accounts);closeModal();switchModule('account');updateBadges();}
function delAccount(id){DB.set('accounts',DB.get('accounts',[]).filter(function(a){return a.id!==id}));closeModal();switchModule('account');updateBadges();}
function budgetModal(){var budgets=DB.get('budgets',{个人:{},工作室:{}});var html='<h2>预算设置</h2><div class="text-sm text-sub mb2">设置每月支出预算，超出80%自动预警</div>';['个人','工作室'].forEach(function(ac){html+='<div class="modal-row"><label>'+(ac==='个人'?'👤 个人':'🎨 工作室')+' 预算</label>';var cats=ac==='工作室'?STU_EXP_CATS:EXP_CATS;cats.forEach(function(c){var v=budgets[ac]&&budgets[ac][c]||0;html+='<div class="flex-between mb2"><span class="text-sm">'+c+'</span><input class="input" type="number" id="m_bud_'+ac+'_'+c+'" value="'+v+'" style="width:120px"></div>'});html+='</div>'});html+='<div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveBudgets()">保存</button></div>';showModal(html);}
function saveBudgets(){var budgets={个人:{},工作室:{}};['个人','工作室'].forEach(function(ac){var cats=ac==='工作室'?STU_EXP_CATS:EXP_CATS;cats.forEach(function(c){var el=document.getElementById('m_bud_'+ac+'_'+c);if(el&&+el.value>0)budgets[ac][c]=+el.value})});DB.set('budgets',budgets);closeModal();switchModule('account');}
