<title>潇潇的工作台</title>
<style>
:root{
  --bg:#faf4ec;--surface:#ffffff;--border:#f0e8db;--text:#3a3a3a;
  --text-sub:#9a9a9e;--text-mute:#c8c8cc;--accent:#f5a8b8;--accent-soft:#fce8ed;
  --green:#a8d4b8;--orange:#f5cba7;--red:#f5a8a8;--purple:#c8b8e0;
  --blue:#a8c8e8;--blue-soft:#e8f0f8;
  --radius:18px;--shadow:0 2px 12px rgba(180,150,120,.08);
  --shadow-hover:0 6px 20px rgba(180,150,120,.15);
  --chuanye:#c8b8e0;--baishe:#a8d4c8;
  --grad-pink:linear-gradient(135deg,#fce8ed 0%,#f5d0d8 100%);
  --grad-blue:linear-gradient(135deg,#e8f0f8 0%,#d0e0f0 100%);
  --grad-warm:linear-gradient(135deg,#faf4ec 0%,#f5e8d8 100%);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#d8d8de;border-radius:3px}::-webkit-scrollbar-track{background:transparent}
.app{display:grid;grid-template-columns:240px 1fr 300px;height:100vh}
.sidebar{background:var(--surface);border-right:none;overflow-y:auto}
.brand{padding:24px 20px 18px;font-size:20px;font-weight:700;color:var(--text);background:transparent}.brand span{color:var(--accent)}
.brand-sub{padding:0 20px 18px;font-size:13px;color:var(--text-sub)}
.nav-group{padding:8px 16px}
.nav-group-title{font-size:11px;color:var(--text-mute);padding:12px 14px 6px;font-weight:500;letter-spacing:.3px;display:flex;align-items:center;gap:6px;text-transform:none}
.nav-group-title .dot{width:8px;height:8px;border-radius:50%}
.nav-brand-header{font-size:12px;font-weight:700;padding:10px 8px 4px;display:flex;align-items:center;gap:6px;margin-top:4px}
.nav-brand-header .dot{width:8px;height:8px;border-radius:50%}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;cursor:pointer;color:var(--text-sub);font-size:14px;transition:all .2s;margin-bottom:2px}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;position:relative}
.nav-item .ico{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.nav-item.sub{padding-left:28px;font-size:12px}
.nav-badge{margin-left:auto;font-size:11px;background:#eee;color:#888;border-radius:10px;padding:1px 7px}
.nav-item.active .nav-badge{background:var(--accent);color:#fff}
.main{overflow-y:auto;padding:24px 28px}
.page-header{display:flex;align-items:flex-start;margin-bottom:22px;gap:12px}
.page-header h1{font-size:24px;font-weight:700;letter-spacing:-.5px}
.page-header .sub{font-size:13px;color:var(--text-sub);margin-top:4px}
.page-header-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.brand-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 10px;border-radius:10px;font-weight:600}
.tag-chuanye{background:#f0edff;color:var(--chuanye)}.tag-baishe{background:#e0f5f0;color:var(--baishe)}
.rightpanel{background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:20px}
.rp-section{margin-bottom:24px}
.rp-title{font-size:12px;font-weight:700;color:var(--text-mute);letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.rp-title a{color:var(--accent);font-size:11px;font-weight:500;cursor:pointer;text-transform:none}
.card{background:var(--surface);border:none;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:all .25s cubic-bezier(.4,0,.2,1)}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}.card[style*="--gc"]{position:relative;overflow:hidden}.card[style*="--gc"]::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gc);opacity:.6}.card-title{font-size:15px;font-weight:600;margin-bottom:14px;color:var(--text)}
.card-grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}

/* ===== Data Layer ===== */
const DB={
  get(k,def){try{const v=localStorage.getItem('xx_'+k);return v?JSON.parse(v):def}catch(e){return def}},
  set(k,v){localStorage.setItem('xx_'+k,JSON.stringify(v))}
};
function todayStr(o=0){const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)}
function uid(){return Date.now()+Math.floor(Math.random()*1000)}
function fmtMoney(n){return n>=10000?(n/10000).toFixed(1)+'万':String(n)}
function esc(s){return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function daysUntil(ds){return Math.ceil((new Date(ds+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000)}
function platformName(p){return{xhs:'小红书',dy:'抖音',wx:'公众号',bili:'B站',other:'其他'}[p]||p}
function weekStart(o){const d=new Date();d.setDate(d.getDate()-d.getDay()+o*7);return d.toISOString().slice(0,10)}
function weekLabel(ws){const d=new Date(ws);return (d.getMonth()+1)+'月'+d.getDate()+'日'}
function getWeekNum(ws){const d=new Date(ws);const j=new Date(d.getFullYear(),0,1);return Math.ceil(((d-j)/86400000+j.getDay()+1)/7)}
function contractExpire(t){if(!t.joinDate||!t.contractMonths)return null;const j=new Date(t.joinDate);const e=new Date(j);e.setMonth(e.getMonth()+t.contractMonths);return{date:e.toISOString().slice(0,10),days:daysUntil(e.toISOString().slice(0,10))}}
function nextBirthday(bd){if(!bd)return null;const t=new Date(todayStr()+'T00:00:00');const m=+bd.slice(5,7),d=+bd.slice(8,10);let n=new Date(t.getFullYear(),m-1,d);if(n<t)n=new Date(t.getFullYear()+1,m-1,d);return{date:n.toISOString().slice(0,10),days:Math.ceil((n-t)/86400000)}}
const DAY_NAMES=['周日','周一','周二','周三','周四','周五','周六'];
const TIME_SLOTS=['9:00-10:30','10:30-12:00','14:00-15:30','15:30-17:00','18:00-19:30','19:30-21:00'];

modules.todo=function(main){
  var todos=DB.get('todos',[]).filter(function(t){return!t.done}).sort(function(a,b){return(a.datetime||'z')>(b.datetime||'z')?1:-1});
  var done=DB.get('todos',[]).filter(function(t){return t.done}).slice(-10).reverse();
  var ov=todos.filter(function(t){return t.datetime&&daysUntil(t.datetime.slice(0,10))<0});
  var td=todos.filter(function(t){return t.datetime&&daysUntil(t.datetime.slice(0,10))===0});
  var h='<div class="page-header"><div><h1>待办提醒</h1><div class="sub">到点提醒 · 不错过每一件重要事</div></div><div class="page-header-actions"><button class="btn btn-primary" onclick="todoModal()">+ 新建待办</button></div></div>';
  if(ov.length)h+='<div class="alert-banner urgent"><span class="alert-icon">⚠️</span><div><strong>'+ov.length+'条待办已逾期</strong> · '+ov.map(function(t){return esc(t.text)}).join('、')+'</div></div>';
  if(td.length)h+='<div class="alert-banner"><span class="alert-icon">📌</span><div><strong>今日待办'+td.length+'项</strong> · '+td.map(function(t){return esc(t.text)}).join('、')+'</div></div>';
  h+='<div class="card-grid g2"><div class="card"><div class="card-title flex-between">待办事项 <span class="text-sm text-mute">'+todos.length+'项未完成</span></div>';
  if(todos.length){
    h+='<div class="timeline">';
    todos.forEach(function(t){
      var d=t.datetime?daysUntil(t.datetime.slice(0,10)):null;
      var cls=d!==null&&d<0?'overdue':d===0?'':'';
      var dt=t.datetime?new Date(t.datetime).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'未设时间';
      var dl=d!==null?(d<0?'逾期'+(-d)+'天':d===0?'今天':'还有'+d+'天'):'';
      h+='<div class="tl-item '+cls+'"><div class="tl-time">'+dt+(dl?' · '+dl:'')+'</div><div class="tl-text">'+esc(t.text)+'</div>';
      if(t.note)h+='<div class="tl-note">'+esc(t.note)+'</div>';
      h+='<div class="tl-actions"><button class="btn btn-sm" onclick="toggleTodo('+t.id+')">✓完成</button><button class="btn btn-sm" onclick="todoModal('+t.id+')">编辑</button><button class="btn btn-sm btn-danger" onclick="delTodo('+t.id+')">删除</button></div></div>';
    });
    h+='</div>';
  }else{h+='<div class="empty"><div class="big">🎯</div>暂无待办，享受生活</div>'}
  h+='</div><div class="card"><div class="card-title flex-between">备忘速记 <a class="text-sm" style="color:var(--accent);cursor:pointer" onclick="memoModal()">+记一条</a></div><div id="memoList">'+renderMemoInline()+'</div></div></div>';
  if(done.length){h+='<div class="card mt"><div class="card-title">已完成('+done.length+')</div>';done.forEach(function(t){h+='<div class="rp-todo done"><div class="mini-check done"></div><span class="t">'+esc(t.text)+'</span></div>'});h+='</div>'}
  main.innerHTML=h;
};
function renderMemoInline(){var ms=DB.get('memos',[]).sort(function(a,b){return b.created-a.created}).slice(0,8);if(!ms.length)return'<div class="empty"><div class="big">📝</div>暂无备忘</div>';return ms.map(function(m){return'<div style="padding:8px 0;border-bottom:1px solid var(--border)"><div class="text-sm" style="white-space:pre-wrap;word-break:break-all">'+esc(m.text)+'</div><div class="flex-between mt2"><span class="text-xs text-mute">'+new Date(m.created).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+'</span><span class="del-x" onclick="delMemo('+m.id+')">×</span></div></div>'}).join('')}
function toggleTodo(id){var ts=DB.get('todos',[]);var t=ts.find(function(x){return x.id===id});t.done=!t.done;DB.set('todos',ts);switchModule('todo');renderRightPanel();}
function delTodo(id){DB.set('todos',DB.get('todos',[]).filter(function(t){return t.id!==id}));switchModule('todo');renderRightPanel();}
function todoModal(id){var t=id?DB.get('todos',[]).find(function(x){return x.id===id}):null;var dt=t&&t.datetime?t.datetime.slice(0,16):todayStr()+'T09:00';showModal('<h2>'+(t?'编辑待办':'新建待办')+'</h2><div class="modal-row"><label>事项内容</label><input class="input" id="m_todo_text" value="'+(t?esc(t.text):'')+'"></div><div class="modal-row"><label>提醒时间</label><input class="input" type="datetime-local" id="m_todo_dt" value="'+dt+'"></div><div class="modal-row"><label>备注</label><input class="input" id="m_todo_note" value="'+(t?esc(t.note||''):'' )+'"></div><div class="modal-actions">'+(t?'<button class="btn btn-danger" style="margin-right:auto" onclick="delTodo('+t.id+');closeModal()">删除</button>':'')+'<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveTodo('+(t?t.id:0)+')">保存</button></div>');}
function saveTodo(id){var text=document.getElementById('m_todo_text').value.trim();if(!text)return;var ts=DB.get('todos',[]);var d={text:text,datetime:document.getElementById('m_todo_dt').value,note:document.getElementById('m_todo_note').value};if(id){Object.assign(ts.find(function(x){return x.id===id}),d)}else{ts.push({id:uid(),text:text,datetime:d.datetime,note:d.note,done:false})}DB.set('todos',ts);closeModal();switchModule('todo');renderRightPanel();}
function quickAddTodo(){var text=prompt('输入待办事项：');if(!text||!text.trim())return;var ts=DB.get('todos',[]);ts.push({id:uid(),text:text.trim(),datetime:todayStr()+'T09:00',note:'',done:false});DB.set('todos',ts);renderRightPanel();}

modules.memo=function(main){var ms=DB.get('memos',[]).sort(function(a,b){return b.created-a.created});main.innerHTML='<div class="page-header"><div><h1>备忘录</h1><div class="sub">灵感闪现，随手记录</div></div><div class="page-header-actions"><button class="btn btn-primary" onclick="memoModal()">+ 新建备忘</button></div></div><div class="card-grid g2">'+(ms.length?ms.map(function(m){return'<div class="card"><div class="text-sm" style="white-space:pre-wrap;word-break:break-all">'+esc(m.text)+'</div><div class="flex-between mt2"><span class="text-xs text-mute">'+new Date(m.created).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+'</span><span class="del-x" onclick="delMemo('+m.id+')">×</span></div></div>'}).join(''):'<div class="empty"><div class="big">📝</div>还没有备忘录</div>')+'</div>'};
function memoModal(){showModal('<h2>新建备忘</h2><div class="modal-row"><label>内容</label><textarea class="input" id="m_memo_text" rows="5" placeholder="记下你的想法..."></textarea></div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveMemo()">保存</button></div>');}
function saveMemo(){var t=document.getElementById('m_memo_text').value.trim();if(!t)return;var ms=DB.get('memos',[]);ms.push({id:uid(),text:t,created:Date.now()});DB.set('memos',ms);closeModal();switchModule('memo');renderRightPanel();}

modules.fitness=function(main){var r=DB.get('fitness',[]);var wd=[];for(var i=6;i>=0;i--){var d=todayStr(-i),rs=r.filter(function(x){return x.date===d});wd.push({date:d,mins:rs.reduce(function(s,x){return s+x.duration},0),cals:rs.reduce(function(s,x){return s+x.calories},0)})}var tm=wd.reduce(function(s,d){return s+d.mins},0),tc=wd.reduce(function(s,d){return s+d.cals},0),ad=wd.filter(function(d){return d.mins>0}).length,mm=Math.max.apply(null,wd.map(function(d){return d.mins}).concat([1]));main.innerHTML='<div class="page-header"><div><h1>健身打卡</h1><div class="sub">坚持运动，保持活力</div></div><div class="page-header-actions"><button class="btn btn-primary" onclick="fitnessModal()">+ 打卡</button></div></div><div class="card-grid g4 mb"><div class="stat"><div class="label">本周时长</div><div class="num">'+tm+'<small>分钟</small></div></div><div class="stat"><div class="label">本周消耗</div><div class="num">'+tc+'<small>千卡</small></div></div><div class="stat"><div class="label">本周打卡</div><div class="num">'+ad+'<small>/7天</small></div></div><div class="stat"><div class="label">总记录</div><div class="num">'+r.length+'</div></div></div><div class="card-grid g2 mb"><div class="card"><div class="card-title">本周运动量</div><div class="bar-chart">'+wd.map(function(d){return'<div class="bar-col"><div class="bar" style="height:'+d.mins/mm*100+'%"></div><div class="bar-label">'+(new Date(d.date).getMonth()+1)+'/'+new Date(d.date).getDate()+'</div></div>'}).join('')+'</div></div><div class="card"><div class="card-title">类型分布</div>'+renderFitTypes(r)+'</div></div><div class="card"><div class="card-title">运动记录</div><div class="table-wrap"><table><thead><tr><th>日期</th><th>类型</th><th>时长</th><th>消耗</th><th>备注</th><th></th></tr></thead><tbody>'+(r.slice(-20).reverse().map(function(x){return'<tr><td>'+x.date+'</td><td><strong>'+esc(x.type)+'</strong></td><td>'+x.duration+'分钟</td><td>'+x.calories+'千卡</td><td class="text-sub">'+esc(x.note||'')+'</td><td><span class="del-x" onclick="delFitness('+x.id+')">×</span></td></tr>'}).join('')||'<tr><td colspan="6" class="empty"><div class="big">🏃</div>开始第一次打卡</td></tr>')+'</tbody></table></div></div>'};
function renderFitTypes(r){var t={};r.forEach(function(x){t[x.type]=(t[x.type]||0)+x.duration});var tot=Object.values(t).reduce(function(s,v){return s+v},0)||1;var cl=['#4f6ef7','#2bb673','#f5a623','#ff5a5a','#9b59b6'];return Object.keys(t).length?Object.entries(t).map(function(kv,i){return'<div class="flex-between mb2"><span class="text-sm">●'+esc(kv[0])+'</span><span class="text-sm text-sub">'+kv[1]+'分钟('+Math.round(kv[1]/tot*100)+'%)</span></div><div class="progress mb2"><div class="progress-bar" style="width:'+kv[1]/tot*100+'%;background:'+cl[i%5]+'"></div></div>'}).join(''):'<div class="empty"><div class="big">📊</div>暂无数据</div>'}
function fitnessModal(){showModal('<h2>健身打卡</h2><div class="modal-row"><label>日期</label><input class="input" type="date" id="m_fd" value="'+todayStr()+'"></div><div class="modal-row"><label>类型</label><select class="input" id="m_ft"><option>跑步</option><option>瑜伽</option><option>力量训练</option><option>游泳</option><option>骑行</option><option>HIIT</option><option>其他</option></select></div><div class="modal-row"><label>时长(分钟)</label><input class="input" type="number" id="m_fdur" value="30"></div><div class="modal-row"><label>消耗(千卡)</label><input class="input" type="number" id="m_fcal" value="200"></div><div class="modal-row"><label>备注</label><input class="input" id="m_fn"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveFitness()">打卡</button></div>');}
function saveFitness(){var r=DB.get('fitness',[]);r.push({id:uid(),date:document.getElementById('m_fd').value,type:document.getElementById('m_ft').value,duration:+document.getElementById('m_fdur').value,calories:+document.getElementById('m_fcal').value,note:document.getElementById('m_fn').value});DB.set('fitness',r);closeModal();switchModule('fitness');}
function delFitness(id){DB.set('fitness',DB.get('fitness',[]).filter(function(x){return x.id!==id}));switchModule('fitness');}

modules.reading=function(main){var b=DB.get('reading',[]);main.innerHTML='<div class="page-header"><div><h1>阅读追踪</h1><div class="sub">在读'+b.filter(function(x){return x.status==='reading'}).length+'本 · 已读'+b.filter(function(x){return x.status==='done'}).length+'本</div></div><div class="page-header-actions"><button class="btn btn-primary" onclick="bookModal()">+添加书目</button></div></div><div class="card-grid g2">'+(b.length?b.map(function(x){var p=Math.round(x.read/x.total*100);return'<div class="card"><div class="flex-between mb2"><div><strong>'+esc(x.title)+'</strong><div class="text-sm text-sub">'+esc(x.author)+'</div></div><span class="chip" style="'+(x.status==='done'?'background:#e8f7ef;color:#2bb673':'')+'">'+(x.status==='done'?'已读完':'在读')+'</span></div><div class="flex-between text-sm"><span class="text-sub">'+x.read+'/'+x.total+'页</span><span class="text-sub">'+p+'%</span></div><div class="progress"><div class="progress-bar '+(p>=80?'green':p>=40?'':'orange')+'" style="width:'+p+'%"></div></div>'+(x.note?'<div class="text-sm text-sub mt2">📝'+esc(x.note)+'</div>':'')+'<div class="flex mt2"><button class="btn btn-sm" onclick="updProg('+x.id+')">更新进度</button><button class="btn btn-sm" onclick="finBook('+x.id+')" '+(x.status==='done'?'disabled':'')+'>标记读完</button><button class="btn-icon" onclick="delBook('+x.id+')" style="margin-left:auto">🗑</button></div></div>'}).join(''):'<div class="empty"><div class="big">📚</div>书架空空如也</div>')+'</div>'};
function bookModal(){showModal('<h2>添加书目</h2><div class="modal-row"><label>书名</label><input class="input" id="m_bt"></div><div class="modal-row"><label>作者</label><input class="input" id="m_ba"></div><div class="modal-row"><label>总页数</label><input class="input" type="number" id="m_btot" value="300"></div><div class="modal-row"><label>已读页数</label><input class="input" type="number" id="m_brd" value="0"></div><div class="modal-row"><label>备注</label><input class="input" id="m_bn"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveBook()">添加</button></div>');}
function saveBook(){var b=DB.get('reading',[]);var rd=+document.getElementById('m_brd').value,tot=+document.getElementById('m_btot').value;b.push({id:uid(),title:document.getElementById('m_bt').value,author:document.getElementById('m_ba').value,total:tot,read:rd,status:rd>=tot?'done':'reading',note:document.getElementById('m_bn').value});DB.set('reading',b);closeModal();switchModule('reading');}
function updProg(id){var b=DB.get('reading',[]);var x=b.find(function(v){return v.id===id});var n=+prompt('更新《'+x.title+'》已读页数（当前'+x.read+'/'+x.total+'）：',x.read);if(!isNaN(n)){x.read=n;if(n>=x.total)x.status='done';DB.set('reading',b);switchModule('reading');}}
function finBook(id){var b=DB.get('reading',[]);var x=b.find(function(v){return v.id===id});x.status='done';x.read=x.total;DB.set('reading',b);switchModule('reading');}
function delBook(id){DB.set('reading',DB.get('reading',[]).filter(function(x){return x.id!==id}));switchModule('reading');}

modules.study=function(main){var p=DB.get('study',[]);main.innerHTML='<div class="page-header"><div><h1>学习计划</h1><div class="sub">持续学习，不断进阶</div></div><div class="page-header-actions"><button class="btn btn-primary" onclick="studyModal()">+新建计划</button></div></div><div class="card-grid g2">'+(p.length?p.map(function(x){var pc=Math.round(x.done/x.total*100);var dl=Math.ceil((new Date(x.deadline)-new Date())/86400000);return'<div class="card"><div class="flex-between mb2"><strong>'+esc(x.title)+'</strong><span class="chip" style="'+(dl<7?'background:#ffeaea;color:#ff5a5a':'')+'">'+(dl>0?'还剩'+dl+'天':'已到期')+'</span></div><div class="flex-between text-sm mb2"><span class="text-sub">进度'+x.done+'/'+x.total+'</span><span class="text-sub">'+pc+'%</span></div><div class="progress mb2"><div class="progress-bar '+(pc>=80?'green':'')+'" style="width:'+pc+'%"></div></div><div class="text-xs text-mute">截止：'+x.deadline+'</div><div class="flex mt2"><button class="btn btn-sm" onclick="studyProg('+x.id+')">更新进度</button><button class="btn-icon" onclick="delStudy('+x.id+')" style="margin-left:auto">🗑</button></div></div>'}).join(''):'<div class="empty"><div class="big">🎓</div>还没有学习计划</div>')+'</div>'};
function studyModal(){showModal('<h2>新建学习计划</h2><div class="modal-row"><label>计划名称</label><input class="input" id="m_st"></div><div class="modal-row"><label>总课时</label><input class="input" type="number" id="m_stot" value="12"></div><div class="modal-row"><label>已完成</label><input class="input" type="number" id="m_sd" value="0"></div><div class="modal-row"><label>截止日期</label><input class="input" type="date" id="m_sdl" value="'+todayStr(30)+'"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveStudy()">创建</button></div>');}
function saveStudy(){var p=DB.get('study',[]);p.push({id:uid(),title:document.getElementById('m_st').value,total:+document.getElementById('m_stot').value,done:+document.getElementById('m_sd').value,deadline:document.getElementById('m_sdl').value,note:''});DB.set('study',p);closeModal();switchModule('study');}
function studyProg(id){var p=DB.get('study',[]);var x=p.find(function(v){return v.id===id});var n=+prompt('更新《'+x.title+'》已完成（当前'+x.done+'/'+x.total+'）：',x.done);if(!isNaN(n)){x.done=n;DB.set('study',p);switchModule('study');}}
function delStudy(id){DB.set('study',DB.get('study',[]).filter(function(x){return x.id!==id}));switchModule('study');}

modules.chores=function(main){var c=DB.get('chores',[]);main.innerHTML='<div class="page-header"><div><h1>家务管理</h1><div class="sub">分工明确，轻松持家</div></div><div class="page-header-actions"><button class="btn btn-primary" onclick="choreModal()">+添加家务</button></div></div><div class="card"><div class="table-wrap"><table><thead><tr><th>家务</th><th>负责人</th><th>周期</th><th>上次完成</th><th>下次提醒</th><th>状态</th><th></th></tr></thead><tbody>'+(c.map(function(x){var od=new Date(x.next)<=new Date();return'<tr><td><strong>'+esc(x.task)+'</strong></td><td><span class="chip">'+esc(x.assignee)+'</span></td><td>'+esc(x.cycle)+'</td><td>'+x.lastDone+'</td><td class="'+(od?'text-red':'')+'">'+x.next+(od?' ⚠️':'')+'</td><td>'+(od?'<span class="chip" style="background:#ffeaea;color:#ff5a5a">逾期</span>':'<span class="chip" style="background:#e8f7ef;color:#2bb673">正常</span>')+'</td><td><button class="btn btn-sm" onclick="doneChore('+x.id+')">完成</button> <span class="del-x" onclick="delChore('+x.id+')">×</span></td></tr>'}).join('')||'<tr><td colspan="7" class="empty"><div class="big">🏠</div>暂无家务安排</td></tr>')+'</tbody></table></div></div>'};
function choreModal(){showModal('<h2>添加家务</h2><div class="modal-row"><label>家务事项</label><input class="input" id="m_ct"></div><div class="modal-row"><label>负责人</label><input class="input" id="m_cw"></div><div class="modal-row"><label>周期</label><select class="input" id="m_cc"><option>每天</option><option>每周</option><option>每两周</option><option>每月</option></select></div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveChore()">添加</button></div>');}
function saveChore(){var c=DB.get('chores',[]);var cy=document.getElementById('m_cc').value;var dy={每天:1,每周:7,'每两周':14,每月:30}[cy];c.push({id:uid(),task:document.getElementById('m_ct').value,assignee:document.getElementById('m_cw').value,cycle:cy,lastDone:todayStr(),next:todayStr(dy)});DB.set('chores',c);closeModal();switchModule('chores');}
function doneChore(id){var c=DB.get('chores',[]);var x=c.find(function(v){return v.id===id});var dy={每天:1,每周:7,'每两周':14,每月:30}[x.cycle];x.lastDone=todayStr();x.next=todayStr(dy);DB.set('chores',c);switchModule('chores');}
function delChore(id){DB.set('chores',DB.get('chores',[]).filter(function(x){return x.id!==id}));switchModule('chores');}

/* ========== 记账本 ========== */
var accFilters={account:'all',type:'all',month:todayStr().slice(0,7)};
var EXP_CATS=['餐饮','交通','购物','日用','娱乐','医疗','住房','其他'];
var INC_CATS=['工资','课时费','兼职','投资','红包','其他'];
var STU_EXP_CATS=['材料采购','房租','教师工资','水电','营销','其他'];
var STU_INC_CATS=['课时费','画材销售','体验课','其他'];
var CAT_ICONS={'餐饮':'🍜','交通':'🚇','购物':'🛍','日用':'🧴','娱乐':'🎮','医疗':'💊','住房':'🏠','其他':'•','工资':'💰','课时费':'🎨','兼职':'✏','投资':'📈','红包':'🧧','材料采购':'📦','房租':'🏢','教师工资':'👤','水电':'💡','营销':'📢','画材销售':'🖌','体验课':'🎯'};

modules.account=function(main){
  var all=DB.get('accounts',[]);
  var budgets=DB.get('budgets',{个人:{},工作室:{}});
  var month=accFilters.month;
  var monthData=all.filter(function(a){return a.date.slice(0,7)===month});
  if(accFilters.account!=='all')monthData=monthData.filter(function(a){return a.account===accFilters.account});
  if(accFilters.type!=='all')monthData=monthData.filter(function(a){return a.type===accFilters.type});
  var income=monthData.filter(function(a){return a.type==='income'}).reduce(function(s,a){return s+a.amount},0);
  var expense=monthData.filter(function(a){return a.type==='expense'}).reduce(function(s,a){return s+a.amount},0);
  var balance=income-expense;
  // 按账户分别统计
  var perAcct={};
  ['个人','工作室'].forEach(function(ac){
    var d=all.filter(function(a){return a.date.slice(0,7)===month&&a.account===ac});
    perAcct[ac]={income:d.filter(function(a){return a.type==='income'}).reduce(function(s,a){return s+a.amount},0),expense:d.filter(function(a){return a.type==='expense'}).reduce(function(s,a){return s+a.amount},0)};
  });
  // 分类统计
  var catData={};
  monthData.filter(function(a){return a.type==='expense'}).forEach(function(a){catData[a.category]=(catData[a.category]||0)+a.amount});
  var catArr=Object.entries(catData).sort(function(a,b){return b[1]-a[1]});
  var maxCat=Math.max.apply(null,catArr.map(function(c){return c[1]}).concat([1]));

  var html='<div class="page-header"><div><h1>记账本</h1><div class="sub">个人 + 工作室 · 双账户管理</div></div><div class="page-header-actions"><button class="btn" onclick="budgetModal()">预算</button><button class="btn btn-primary" onclick="accountModal()">+ 记一笔</button></div></div>';

  // 月份选择器
  html+='<div class="flex mb"><input class="input" type="month" id="acc_month" value="'+month+'" style="width:160px" onchange="accFilters.month=this.value;switchModule(\'account\')"><select class="input" style="width:120px" onchange="accFilters.account=this.value;switchModule(\'account\')"><option value="all" '+(accFilters.account==='all'?'selected':'')+'>全部账户</option><option value="个人" '+(accFilters.account==='个人'?'selected':'')+'>个人</option><option value="工作室" '+(accFilters.account==='工作室'?'selected':'')+'>工作室</option></select><select class="input" style="width:100px" onchange="accFilters.type=this.value;switchModule(\'account\')"><option value="all" '+(accFilters.type==='all'?'selected':'')+'>全部</option><option value="income" '+(accFilters.type==='income'?'selected':'')+'>收入</option><option value="expense" '+(accFilters.type==='expense'?'selected':'')+'>支出</option></select></div>';

  // 统计卡片
  html+='<div class="card-grid g4 mb"><div class="stat" style="--gc:var(--grad-green)"><div class="label">本月收入</div><div class="num text-green">¥'+fmtMoney(income)+'</div></div><div class="stat"><div class="label">本月支出</div><div class="num text-red">¥'+fmtMoney(expense)+'</div></div><div class="stat"><div class="label">本月结余</div><div class="num '+(balance>=0?'text-green':'text-red')+'">¥'+fmtMoney(balance)+'</div></div><div class="stat"><div class="label">记录笔数</div><div class="num">'+monthData.length+'</div></div></div>';

  // 账户分栏
  html+='<div class="card-grid g2 mb"><div class="card" style="--gc:var(--grad-blue)"><div class="card-title"><span style="display:inline-block;width:24px;height:24px;background:#eef1ff;color:#4f6ef7;border-radius:50%;text-align:center;line-height:24px;margin-right:6px;font-size:12px">个</span>个人账户</div><div class="flex-between text-sm mb2"><span class="text-sub">收入</span><span class="text-green">¥'+fmtMoney(perAcct['个人'].income)+'</span></div><div class="flex-between text-sm mb2"><span class="text-sub">支出</span><span class="text-red">¥'+fmtMoney(perAcct['个人'].expense)+'</span></div><div class="flex-between text-sm"><span class="text-sub">结余</span><span class="' + (perAcct['个人'].income-perAcct['个人'].expense>=0?'text-green':'text-red')+'"><strong>¥'+fmtMoney(perAcct['个人'].income-perAcct['个人'].expense)+'</strong></span></div></div><div class="card" style="--gc:var(--grad-purple)"><div class="card-title"><span style="display:inline-block;width:24px;height:24px;background:#f0edff;color:#6c5ce7;border-radius:50%;text-align:center;line-height:24px;margin-right:6px;font-size:12px">画</span>工作室账户</div><div class="flex-between text-sm mb2"><span class="text-sub">收入</span><span class="text-green">¥'+fmtMoney(perAcct['工作室'].income)+'</span></div><div class="flex-between text-sm mb2"><span class="text-sub">支出</span><span class="text-red">¥'+fmtMoney(perAcct['工作室'].expense)+'</span></div><div class="flex-between text-sm"><span class="text-sub">结余</span><span class="'+(perAcct['工作室'].income-perAcct['工作室'].expense>=0?'text-green':'text-red')+'"><strong>¥'+fmtMoney(perAcct['工作室'].income-perAcct['工作室'].expense)+'</strong></span></div></div></div>';

  // 预算进度 + 分类排行
  html+='<div class="card-grid g2 mb">';
  // 预算
  var budAcct=accFilters.account==='all'?'个人':accFilters.account;
  var bud=budgets[budAcct]||{};
  var budTotal=Object.values(bud).reduce(function(s,v){return s+v},0);
  var budUsed=Object.entries(bud).map(function(kv){return catData[kv[0]]||0}).reduce(function(s,v){return s+v},0);
  html+='<div class="card"><div class="card-title flex-between">预算执行 ('+budAcct+') <button class="btn btn-sm" onclick="budgetModal()">设置</button></div>'+(budTotal>0?'<div class="flex-between text-sm mb2"><span class="text-sub">总预算 ¥'+budTotal+' / 已用 ¥'+budUsed+'</span><span class="'+(budUsed/budTotal>0.9?'text-red':budUsed/budTotal>0.7?'text-orange':'text-green')+'">'+Math.round(budUsed/budTotal*100)+'%</span></div><div class="progress mb2"><div class="progress-bar '+(budUsed/budTotal>0.9?'red':budUsed/budTotal>0.7?'orange':'')+'" style="width:'+Math.min(budUsed/budTotal*100,100)+'%"></div></div>':'<div class="text-sm text-mute" style="padding:8px 0">未设置预算，点击右上角设置</div>');
  Object.entries(bud).forEach(function(kv){
    var used=catData[kv[0]]||0;var pct=kv[1]?Math.round(used/kv[1]*100):0;
    html+='<div class="flex-between text-xs mb2"><span>'+esc(kv[0])+'</span><span class="text-sub">¥'+used+'/¥'+kv[1]+' ('+pct+'%)</span></div><div class="progress mb2"><div class="progress-bar '+(pct>90?'red':pct>70?'orange':'green')+'" style="width:'+Math.min(pct,100)+'%"></div></div>';
  });
  html+='</div>';
  // 分类排行
  html+='<div class="card"><div class="card-title">支出分类排行</div>'+(catArr.length?catArr.map(function(c,i){return'<div class="flex-between mb2"><div style="flex:1">'+(CAT_ICONS[c[0]]||'📝')+' <span class="text-mute">'+(i+1)+'.</span> '+esc(c[0])+'</div>'+'<span class="text-sm text-sub">¥'+fmtMoney(c[1])+' ('+Math.round(c[1]/expense*100)+'%)</span></div><div class="progress mb2"><div class="progress-bar" style="width:'+c[1]/maxCat*100+'%;background:['+['#4f6ef7','#2bb673','#f5a623','#ff5a5a','#9b59b6','#00a085','#6c5ce7','#e84393'][i%8]+']"></div></div>'}).join(''):'<div class="empty"><div class="big">📊</div>本月暂无支出</div>')+'</div>';
  html+='</div>';

  // 流水明细
  var sorted=monthData.sort(function(a,b){return a.date<b.date?1:-1});
  html+='<div class="card"><div class="card-title flex-between">收支流水 <span class="text-sm text-mute">'+monthData.length+'笔</span></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>账户</th><th>类型</th><th>分类</th><th>金额</th><th>备注</th><th></th></tr></thead><tbody>'+(sorted.map(function(a){return'<tr><td class="text-sm">'+a.date+'</td><td>'+(CAT_ICONS[a.category]||'📝')+'</td><td><span class="chip" style="'+(a.account==='个人'?'background:#eef1ff;color:#4f6ef7':'background:#f0edff;color:#6c5ce7')+'">'+esc(a.account)+'</span></td><td>'+(a.type==='income'?'<span class="chip" style="background:#e8f7ef;color:#2bb673">收入</span>':'<span class="chip" style="background:#ffeaea;color:#ff5a5a">支出</span>')+'</td><td>'+esc(a.category)+'</td><td class="'+(a.type==='income'?'text-green':'text-red')+'"><strong>'+(a.type==='income'?'+':'-')+'¥'+a.amount+'</strong></td><td class="text-sm text-sub">'+esc(a.note||'')+'</td><td><button class="btn-icon" onclick="accountModal('+a.id+')">✎</button> <span class="del-x" onclick="delAccount('+a.id+')">×</span></td></tr>'}).join('')||'<tr><td colspan="8" class="empty"><div class="big">💰</div>本月暂无记录，点击右上角记一笔</td></tr>')+'</tbody></table></div></div>';

  main.innerHTML=html;
};

function accountModal(id){
  var a=id?DB.get('accounts',[]).find(function(x){return x.id===id}):null;
  var isExp=a?a.type==='expense':true;
  var ac=a?a.account:'个人';
  var cats=ac==='工作室'?(isExp?STU_EXP_CATS:STU_INC_CATS):EXP_CATS.concat(INC_CATS);
  showModal('<h2>'+(a?'编辑记录':'记一笔')+'</h2><div class="modal-row"><label>账户</label><select class="input" id="m_a_acct" onchange="updateAccCats()"><option value="个人" '+(ac==='个人'?'selected':'')+'>👤 个人</option><option value="工作室" '+(ac==='工作室'?'selected':'')+'>🎨 工作室</option></select></div><div class="modal-row"><label>类型</label><div class="pri-btns"><div class="pri-btn '+(isExp?'':'active')+'" data-val="income" onclick="accSelectType(this)">收入</div><div class="pri-btn '+(isExp?'active':'')+'" data-val="expense" onclick="accSelectType(this)">支出</div></div></div><div class="modal-row"><label>分类</label><select class="input" id="m_a_cat">'+cats.map(function(c){return'<option '+(a&&a.category===c?'selected':'')+'>'+c+'</option>'}).join('')+'</select></div><div class="modal-row"><label>金额</label><input class="input" type="number" id="m_a_amt" value="'+(a?a.amount:'')+'" placeholder="0.00"></div><div class="modal-row"><label>日期</label><input class="input" type="date" id="m_a_date" value="'+(a?a.date:todayStr())+'"></div><div class="modal-row"><label>备注</label><input class="input" id="m_a_note" value="'+(a?esc(a.note||''):'' )+'" placeholder="补充说明"></div><div class="modal-actions">'+(a?'<button class="btn btn-danger" style="margin-right:auto" onclick="delAccount('+a.id+')">删除</button>':'')+'<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveAccount('+(a?a.id:0)+')">保存</button></div>');
}
var accSelType='expense';
function accSelectType(el){document.querySelectorAll('.pri-btn').forEach(function(b){b.classList.remove('active')});el.classList.add('active');accSelType=el.dataset.val;updateAccCats();}
function updateAccCats(){var ac=document.getElementById('m_a_acct').value;var cats=ac==='工作室'?(accSelType==='expense'?STU_EXP_CATS:STU_INC_CATS):(accSelType==='expense'?EXP_CATS:INC_CATS);var sel=document.getElementById('m_a_cat');sel.innerHTML=cats.map(function(c){return'<option>'+c+'</option>'}).join('');}
function saveAccount(id){var amt=+document.getElementById('m_a_amt').value;if(!amt)return;var accounts=DB.get('accounts',[]);var d={account:document.getElementById('m_a_acct').value,type:accSelType,category:document.getElementById('m_a_cat').value,amount:amt,date:document.getElementById('m_a_date').value,note:document.getElementById('m_a_note').value};if(id){Object.assign(accounts.find(function(x){return x.id===id}),d)}else{accounts.push(Object.assign({id:uid()},d))}DB.set('accounts',accounts);closeModal();switchModule('account');updateBadges();}
function delAccount(id){DB.set('accounts',DB.get('accounts',[]).filter(function(a){return a.id!==id}));closeModal();switchModule('account');updateBadges();}
function budgetModal(){var budgets=DB.get('budgets',{个人:{},工作室:{}});var html='<h2>预算设置</h2><div class="text-sm text-sub mb2">设置每月支出预算，超出80%自动预警</div>';['个人','工作室'].forEach(function(ac){html+='<div class="modal-row"><label>'+(ac==='个人'?'👤 个人':'🎨 工作室')+' 预算</label>';var cats=ac==='工作室'?STU_EXP_CATS:EXP_CATS;cats.forEach(function(c){var v=budgets[ac]&&budgets[ac][c]||0;html+='<div class="flex-between mb2"><span class="text-sm">'+c+'</span><input class="input" type="number" id="m_bud_'+ac+'_'+c+'" value="'+v+'" style="width:120px"></div>'});html+='</div>'});html+='<div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveBudgets()">保存</button></div>';showModal(html);}
function saveBudgets(){var budgets={个人:{},工作室:{}};['个人','工作室'].forEach(function(ac){var cats=ac==='工作室'?STU_EXP_CATS:EXP_CATS;cats.forEach(function(c){var el=document.getElementById('m_bud_'+ac+'_'+c);if(el&&+el.value>0)budgets[ac][c]=+el.value})});DB.set('budgets',budgets);closeModal();switchModule('account');}

/* ========== 自媒体运营 ========== */
modules.kanban=function(main){var cs=DB.get('contents',[]);var cols={idea:cs.filter(function(c){return c.status==='idea'}),draft:cs.filter(function(c){return c.status==='draft'}),review:cs.filter(function(c){return c.status==='review'}),published:cs.filter(function(c){return c.status==='published'})};main.innerHTML='<div class="page-header"><div><h1>内容看板</h1><div class="sub">从选题到发布，管理内容全流程</div></div><div class="page-header-actions"><button class="btn btn-primary" onclick="contentModal()">+ 新建内容</button></div></div><div class="kanban">'+[['idea','💡 选题池'],['draft','✍️ 草稿中'],['review','👀 待审核'],['published','✅ 已发布']].map(function(col){var k=col[0],t=col[1];return'<div class="kanban-col"><h4>'+t+' <span class="cnt">'+cols[k].length+'</span></div>'+(cols[k].length?cols[k].map(function(c){return'<div class="kanban-card" onclick="contentEdit('+c.id+')"><div class="kc-title">'+esc(c.title)+'</div><div class="kc-meta"><span class="tag '+(c.platform==='xhs'?'tag-xhs':c.platform==='dy'?'tag-dy':c.platform==='wx'?'tag-wx':'tag-other')+'">'+platformName(c.platform)+'</span>'+(c.views?'<span class="tag">👁'+fmtMoney(c.views)+'</span>':'')+(c.likes?'<span class="tag">❤'+fmtMoney(c.likes)+'</span>':'')+'</div></div>'}).join(''):'<div class="text-sm text-mute" style="text-align:center;padding:20px 0">暂无</div>')+'</div>'}).join('')+'</div>'};
function contentModal(id){var c=id?DB.get('contents',[]).find(function(x){return x.id===id}):null;showModal('<h2>'+(c?'编辑内容':'新建内容')+'</h2><div class="modal-row"><label>标题</label><input class="input" id="m_c_title" value="'+(c?esc(c.title):'')+'"></div><div class="modal-row"><label>平台</label><select class="input" id="m_c_platform">'+[['xhs','小红书'],['dy','抖音'],['wx','公众号'],['bili','B站'],['other','其他']].map(function(o){return'<option value="'+o[0]+'" '+(c&&c.platform===o[0]?'selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div><div class="modal-row"><label>状态</label><select class="input" id="m_c_status">'+[['idea','选题池'],['draft','草稿中'],['review','待审核'],['published','已发布']].map(function(o){return'<option value="'+o[0]+'" '+(c&&c.status===o[0]?'selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div><div class="modal-row"><label>计划日期</label><input class="input" type="date" id="m_c_date" value="'+(c?c.date:todayStr())+'"></div><div class="modal-row" id="dataRow" style="'+(c&&c.status==='published'?'':'display:none')+'"><label>数据</label><div class="flex"><input class="input" type="number" id="m_c_views" value="'+(c?c.views:0)+'" placeholder="阅读量"><input class="input" type="number" id="m_c_likes" value="'+(c?c.likes:0)+'" placeholder="点赞"></div></div><div class="modal-row"><label>备注</label><input class="input" id="m_c_notes" value="'+(c?esc(c.notes||''):'' )+'"></div><div class="modal-actions">'+(c?'<button class="btn btn-danger" style="margin-right:auto" onclick="delContent('+c.id+')">删除</button>':'')+'<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveContent('+(c?c.id:0)+')">保存</button></div>');document.getElementById('m_c_status').addEventListener('change',function(e){document.getElementById('dataRow').style.display=e.target.value==='published'?'block':'none'});}
function contentEdit(id){contentModal(id)}
function saveContent(id){var cs=DB.get('contents',[]);var d={title:document.getElementById('m_c_title').value,platform:document.getElementById('m_c_platform').value,status:document.getElementById('m_c_status').value,date:document.getElementById('m_c_date').value,views:+document.getElementById('m_c_views').value||0,likes:+document.getElementById('m_c_likes').value||0,notes:document.getElementById('m_c_notes').value};if(id){Object.assign(cs.find(function(x){return x.id===id}),d)}else{cs.push(Object.assign({id:uid()},d))}DB.set('contents',cs);closeModal();switchModule('kanban');renderRightPanel();}
function delContent(id){DB.set('contents',DB.get('contents',[]).filter(function(c){return c.id!==id}));closeModal();switchModule('kanban');renderRightPanel();}

modules.analytics=function(main){var cs=DB.get('contents',[]).filter(function(c){return c.status==='published'});var tv=cs.reduce(function(s,c){return s+c.views},0),tl=cs.reduce(function(s,c){return s+c.likes},0);var av=cs.length?Math.round(tv/cs.length):0;var er=tv?(tl/tv*100).toFixed(1):0;var hot=cs.filter(function(c){return c.views>=3000}).length;var bp={};cs.forEach(function(c){if(!bp[c.platform])bp[c.platform]={views:0,likes:0,count:0};bp[c.platform].views+=c.views;bp[c.platform].likes+=c.likes;bp[c.platform].count++});main.innerHTML='<div class="page-header"><div><h1>数据分析</h1><div class="sub">已发布'+cs.length+'篇 · 爆款率'+(cs.length?Math.round(hot/cs.length*100):0)+'%</div></div></div><div class="card-grid g4 mb"><div class="stat"><div class="label">总阅读量</div><div class="num">'+fmtMoney(tv)+'</div></div><div class="stat"><div class="label">总点赞</div><div class="num">'+fmtMoney(tl)+'</div></div><div class="stat"><div class="label">篇均阅读</div><div class="num">'+fmtMoney(av)+'</div></div><div class="stat"><div class="label">互动率</div><div class="num">'+er+'<small>%</small></div></div></div><div class="card-grid g2 mb"><div class="card"><div class="card-title">各平台数据</div><div class="table-wrap"><table><thead><tr><th>平台</th><th>篇数</th><th>总阅读</th><th>总点赞</th><th>互动率</th></tr></thead><tbody>'+Object.entries(bp).map(function(kv){var p=kv[0],d=kv[1];return'<tr><td><span class="tag '+(p==='xhs'?'tag-xhs':p==='dy'?'tag-dy':p==='wx'?'tag-wx':'tag-other')+'">'+platformName(p)+'</span></td><td>'+d.count+'</td><td>'+fmtMoney(d.views)+'</td><td>'+fmtMoney(d.likes)+'</td><td>'+(d.views?(d.likes/d.views*100).toFixed(1):0)+'%</td></tr>'}).join('')+'</tbody></table></div></div><div class="card"><div class="card-title">爆款TOP5</div>'+(cs.length?cs.sort(function(a,b){return b.views-a.views}).slice(0,5).map(function(c,i){return'<div class="flex-between mb2"><div style="flex:1"><span class="text-mute">'+(i+1)+'.</span> '+esc(c.title)+' <span class="tag '+(c.platform==='xhs'?'tag-xhs':c.platform==='dy'?'tag-dy':c.platform==='wx'?'tag-wx':'tag-other')+'">'+platformName(c.platform)+'</span></div><span class="text-sm text-sub">👁'+fmtMoney(c.views)+'</span></div>'}).join(''):'<div class="empty"><div class="big">📊</div>暂无数据</div>')+'</div></div><div class="card"><div class="card-title">内容数据明细</div><div class="table-wrap"><table><thead><tr><th>标题</th><th>平台</th><th>发布日期</th><th>阅读</th><th>点赞</th><th>互动率</th><th></th></tr></thead><tbody>'+(cs.sort(function(a,b){return a.date<b.date?1:-1}).map(function(c){return'<tr><td>'+esc(c.title)+'</td><td><span class="tag '+(c.platform==='xhs'?'tag-xhs':c.platform==='dy'?'tag-dy':c.platform==='wx'?'tag-wx':'tag-other')+'">'+platformName(c.platform)+'</span></td><td>'+c.date+'</td><td>'+fmtMoney(c.views)+'</td><td>'+fmtMoney(c.likes)+'</td><td class="'+(c.views&&c.likes/c.views>0.05?'text-green':'')+'">'+(c.views?(c.likes/c.views*100).toFixed(1):0)+'%</td><td><button class="btn btn-sm" onclick="contentEdit('+c.id+')">编辑</button></td></tr>'}).join('')||'<tr><td colspan="7" class="empty">暂无已发布内容</td></tr>')+'</tbody></table></div></div>'};

modules.pubcal=function(main){var cs=DB.get('contents',[]);var now=new Date(),y=now.getFullYear(),m=now.getMonth();var first=new Date(y,m,1),last=new Date(y,m+1,0);var sd=first.getDay(),days=last.getDate();var cells=[];var pl=new Date(y,m,0).getDate();for(var i=sd-1;i>=0;i--)cells.push({day:pl-i,other:true});for(var d=1;d<=days;d++){var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');cells.push({day:d,date:ds,events:cs.filter(function(c){return c.date===ds}),today:ds===todayStr()})}while(cells.length%7)cells.push({other:true});main.innerHTML='<div class="page-header"><div><h1>发布日历</h1><div class="sub">'+y+'年'+(m+1)+'月 · 共'+cs.length+'条内容</div></div><div class="page-header-actions"><button class="btn btn-primary" onclick="contentModal()">+安排发布</button></div></div><div class="card"><div class="cal-grid">'+['日','一','二','三','四','五','六'].map(function(d){return'<div class="cal-head">'+d+'</div>'}).join('')+cells.map(function(c){return'<div class="cal-cell '+(c.other?'other':'')+(c.today?' today':'')+'">'+(c.day?'<div class="date">'+c.day+'</div>':'')+(c.events&&c.events.length?c.events.map(function(e){return'<div class="cal-event">'+esc(e.title.slice(0,5))+'</div>'}).join(''):'')+'</div>'}).join('')+'</div></div><div class="card mt"><div class="card-title">即将发布</div>'+(cs.filter(function(c){return c.date>=todayStr()}).sort(function(a,b){return a.date>b.date?1:-1}).map(function(c){return'<div class="flex-between mb2"><div><strong>'+esc(c.title)+'</strong> <span class="tag '+(c.platform==='xhs'?'tag-xhs':c.platform==='dy'?'tag-dy':c.platform==='wx'?'tag-wx':'tag-other')+'">'+platformName(c.platform)+'</span></div><span class="text-sm text-sub">'+c.date+'</span></div>'}).join('')||'<div class="empty"><div class="big">📅</div>暂无发布计划</div>')+'</div>'};

/* ========== 川也艺术 - 学员综合台账 ========== */
modules.cy_students=function(main){
  var ss=DB.get('cy_students',[]);
  var trialed=ss.filter(function(s){return s.trial!=='待试听'}).length;
  var converted=ss.filter(function(s){return s.trial==='已转化'}).length;
  var convRate=trialed?Math.round(converted/trialed*100):0;
  var needRenew=ss.filter(function(s){return s.renew==='待续费'}).length;
  var lowHours=ss.filter(function(s){return s.totalHours>0&&s.totalHours-s.usedHours<=5}).length;
  main.innerHTML='<div class="page-header"><div><h1>学员综合台账 <span class="brand-tag tag-chuanye">川也艺术</span></h1><div class="sub">学员档案 · 课时管理 · 试听转化</div></div><div class="page-header-actions"><button class="btn" onclick="studentPasteModal()">📋 批量粘贴</button><button class="btn btn-primary" onclick="studentModal()">+ 新增学员</button></div></div><div class="card-grid g4 mb"><div class="stat"><div class="label">在册学员</div><div class="num">'+ss.length+'</div></div><div class="stat"><div class="label">试听转化率</div><div class="num text-green">'+convRate+'<small>%</small></div></div><div class="stat"><div class="label">待续费</div><div class="num text-orange">'+needRenew+'</div></div><div class="stat"><div class="label">课时预警</div><div class="num text-red">'+lowHours+'</div></div></div><div class="card"><div class="table-wrap"><table><thead><tr><th>姓名</th><th>班级</th><th>课时进度</th><th>剩余</th><th>家长</th><th>电话</th><th>试听</th><th>续费</th><th>报名日期</th><th>备注</th><th></th></tr></thead><tbody>'+(ss.map(function(s){var left=s.totalHours-s.usedHours;var pct=s.totalHours?Math.round(s.usedHours/s.totalHours*100):0;return'<tr><td><strong>'+esc(s.name)+'</strong></td><td>'+esc(s.class)+'</td><td style="min-width:120px"><div class="flex-between text-xs"><span>'+s.usedHours+'/'+s.totalHours+'</span><span>'+pct+'%</span></div><div class="progress" style="height:4px"><div class="progress-bar '+(left<=5&&s.totalHours>0?'orange':'green')+'" style="width:'+pct+'%"></div></div></td><td class="'+(left<=5&&s.totalHours>0?'text-red':'')+'">'+(s.totalHours?left:'-')+'</td><td class="text-sm">'+esc(s.parent)+'</td><td class="text-sm">'+esc(s.phone)+'</td><td><span class="chip" style="'+(s.trial==='已转化'?'background:#e8f7ef;color:#2bb673':s.trial==='待试听'?'background:#fff4e0;color:#f5a623':'')+'">'+esc(s.trial)+'</span></td><td><span class="chip" style="'+(s.renew==='待续费'?'background:#ffeaea;color:#ff5a5a':s.renew==='已续费'?'background:#e8f7ef;color:#2bb673':'')+'">'+esc(s.renew)+'</span></td><td class="text-sm">'+(s.joinDate||'-')+'</td><td class="text-sm text-sub">'+esc(s.note||'')+'</td><td><button class="btn-icon" onclick="studentModal('+s.id+')">✎</button> <span class="del-x" onclick="delStudent('+s.id+')">×</span></td></tr>'}).join('')||'<tr><td colspan="11" class="empty"><div class="big">👥</div>暂无学员</td></tr>')+'</tbody></table></div></div>';
};
function studentModal(id){var s=id?DB.get('cy_students',[]).find(function(x){return x.id===id}):null;showModal('<h2>'+(s?'编辑学员':'新增学员')+'</h2><div class="modal-row"><label>姓名</label><input class="input" id="m_s_name" value="'+(s?esc(s.name):'')+'"></div><div class="modal-row"><label>班级</label><input class="input" id="m_s_class" value="'+(s?esc(s.class):'')+'" placeholder="如：少儿创意画"></div><div class="modal-row"><label>总课时</label><input class="input" type="number" id="m_s_total" value="'+(s?s.totalHours:48)+'"></div><div class="modal-row"><label>已用课时</label><input class="input" type="number" id="m_s_used" value="'+(s?s.usedHours:0)+'"></div><div class="modal-row"><label>家长</label><input class="input" id="m_s_parent" value="'+(s?esc(s.parent):'')+'"></div><div class="modal-row"><label>电话</label><input class="input" id="m_s_phone" value="'+(s?esc(s.phone):'')+'"></div><div class="modal-row"><label>试听结果</label><select class="input" id="m_s_trial">'+[['待试听','待试听'],['已试听','已试听'],['已转化','已转化']].map(function(o){return'<option '+(s&&s.trial===o[0]?'selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div><div class="modal-row"><label>续费状态</label><select class="input" id="m_s_renew">'+[['未报名','未报名'],['新学员','新学员'],['已续费','已续费'],['待续费','待续费']].map(function(o){return'<option '+(s&&s.renew===o[0]?'selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div><div class="modal-row"><label>报名日期</label><input class="input" type="date" id="m_s_join" value="'+(s?s.joinDate:todayStr())+'"></div><div class="modal-row"><label>备注</label><input class="input" id="m_s_note" value="'+(s?esc(s.note||''):'' )+'"></div><div class="modal-actions">'+(s?'<button class="btn btn-danger" style="margin-right:auto" onclick="delStudent('+s.id+')">删除</button>':'')+'<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveStudent('+(s?s.id:0)+')">保存</button></div>');}
function saveStudent(id){var ss=DB.get('cy_students',[]);var d={name:document.getElementById('m_s_name').value,class:document.getElementById('m_s_class').value,totalHours:+document.getElementById('m_s_total').value||0,usedHours:+document.getElementById('m_s_used').value||0,parent:document.getElementById('m_s_parent').value,phone:document.getElementById('m_s_phone').value,trial:document.getElementById('m_s_trial').value,renew:document.getElementById('m_s_renew').value,joinDate:document.getElementById('m_s_join').value,note:document.getElementById('m_s_note').value};if(id){Object.assign(ss.find(function(x){return x.id===id}),d)}else{ss.push(Object.assign({id:uid()},d))}DB.set('cy_students',ss);closeModal();switchModule('cy_students');renderRightPanel();}
function delStudent(id){DB.set('cy_students',DB.get('cy_students',[]).filter(function(s){return s.id!==id}));closeModal();switchModule('cy_students');renderRightPanel();}
function studentPasteModal(){showModal('<h2>批量粘贴录入</h2><div class="modal-row"><label>粘贴表格数据（每行一条，用Tab或逗号分隔）</label><p class="text-sm text-sub mb2">格式：姓名, 班级, 总课时, 已用课时, 家长, 电话, 试听, 续费</p><textarea class="input paste-area" id="m_paste" placeholder="朵朵, 少儿创意画, 48, 32, 王女士, 138****1234, 已转化, 已续费&#10;小明, 素描基础, 24, 8, 李先生, 139****5678, 已转化, 新学员"></textarea></div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="studentPasteSave()">批量导入</button></div>');}
function studentPasteSave(){var txt=document.getElementById('m_paste').value.trim();if(!txt)return;var lines=txt.split('\n');var ss=DB.get('cy_students',[]);var count=0;lines.forEach(function(line){var f=line.split(/[\t,，]/).map(function(x){return x.trim()});if(f[0]){ss.push({id:uid(),name:f[0]||'',class:f[1]||'',totalHours:+f[2]||0,usedHours:+f[3]||0,phone:f[5]||'',parent:f[4]||'',trial:f[6]||'待试听',renew:f[7]||'未报名',joinDate:todayStr(),note:''});count++}});DB.set('cy_students',ss);closeModal();switchModule('cy_students');alert('成功导入'+count+'条学员记录');}

/* ========== 川也艺术 - 周课程排课 ========== */
modules.cy_schedule=function(main){
  var ws=weekStart(cyScheduleOffset);
  var scheds=DB.get('cy_schedule',[]).filter(function(s){return s.weekStart===ws});
  var days=['周日','周一','周二','周三','周四','周五','周六'];
  var dates=[];for(var i=0;i<7;i++){var d=new Date(ws);d.setDate(d.getDate()+i);dates.push((d.getMonth()+1)+'/'+d.getDate())}
  main.innerHTML='<div class="page-header"><div><h1>周课程排课 <span class="brand-tag tag-chuanye">川也艺术</span></h1><div class="sub">'+(new Date(ws).getMonth()+1)+'月'+new Date(ws).getDate()+'日 开始的一周 · 第'+getWeekNum(ws)+'周</div></div><div class="page-header-actions"><button class="btn" onclick="cyScheduleOffset--;switchModule(\'cy_schedule\')">‹ 上周</button><button class="btn" onclick="cyScheduleOffset=0;switchModule(\'cy_schedule\')">本周</button><button class="btn" onclick="cyScheduleOffset++;switchModule(\'cy_schedule\')">下周 ›</button><button class="btn btn-primary" onclick="scheduleModal()">+ 添加课程</button></div></div><div class="card"><div class="week-grid"><div style="padding:4px"></div>'+days.map(function(d,i){return'<div class="week-slot" style="text-align:center;background:var(--bg)"><strong>'+d+'</strong><div class="text-xs text-mute">'+dates[i]+'</div></div>'}).join('')+TIME_SLOTS.map(function(ts){return'<div class="week-slot" style="display:flex;align-items:center;background:var(--bg)"><span class="ws-time">'+ts+'</span></div>'+days.map(function(d,i){var lesson=scheds.find(function(s){return s.timeSlot===ts&&s.day===i});return'<div class="week-slot" onclick="'+(lesson?'scheduleModal('+lesson.id+')':'scheduleModal(0,'+i+',\''+ts+'\')')+'">'+(lesson?'<div class="week-lesson">'+esc(lesson.course)+'<br>'+esc(lesson.students)+'</div>':'<span class="text-mute" style="opacity:.3">+</span>')+'</div>'}).join('')}).join('')+'</div></div>'+(scheds.length?'<div class="card mt"><div class="card-title">本周课程明细</div><div class="table-wrap"><table><thead><tr><th>星期</th><th>时间</th><th>课程</th><th>学员</th><th>备注</th><th></th></tr></thead><tbody>'+scheds.map(function(s){return'<tr><td>'+days[s.day]+'</td><td>'+s.timeSlot+'</td><td><strong>'+esc(s.course)+'</strong></td><td>'+esc(s.students)+'</td><td class="text-sm text-sub">'+esc(s.note||'')+'</td><td><button class="btn btn-sm" onclick="scheduleModal('+s.id+')">编辑</button> <span class="del-x" onclick="delSchedule('+s.id+')">×</span></td></tr>'}).join('')+'</tbody></table></div></div>':'');
};

function renderBSAttendance(main,store){
  var teachers=DB.get('bs_teachers',[]).filter(function(t){return t.store===store});
  var att=DB.get('bs_attendance',[]).filter(function(a){return a.store===store});
  // 本周/本月统计
  var ws=weekStart(0);
  var monthStr=todayStr().slice(0,7);
  var weekAtt=att.filter(function(a){return a.date>=ws});
  var monthAtt=att.filter(function(a){return a.date.slice(0,7)===monthStr});
  // 按老师统计出勤率
  function calcRate(records){
    var totalExp=records.reduce(function(s,a){return s+a.expected},0);
    var totalAct=records.reduce(function(s,a){return s+a.actual},0);
    return totalExp?Math.round(totalAct/totalExp*100):0;
  }
  var weekRate=calcRate(weekAtt);
  var monthRate=calcRate(monthAtt);
  // 每位老师的出勤率
  var teacherRates=teachers.map(function(t){
    var wR=weekAtt.filter(function(a){return a.teacherName===t.name});
    var mR=monthAtt.filter(function(a){return a.teacherName===t.name});
    return{name:t.name,weekRate:calcRate(wR),monthRate:calcRate(mR),weekRecords:wR.length,monthRecords:mR.length};
  });
  // 今日出勤
  var todayAtt=att.filter(function(a){return a.date===todayStr()});
  // 最近7天出勤记录
  var recentAtt=att.sort(function(a,b){return a.date<b.date?1:-1}).slice(0,14);

  var color=store==='万科店'?'var(--baishe)':'var(--baishe)';
  main.innerHTML='<div class="page-header"><div><h1>'+store+' 出勤管理 <span class="brand-tag tag-baishe">白舍艺术</span></h1><div class="sub">每日出勤录入 · 周/月自动汇总</div></div><div class="page-header-actions"><button class="btn" onclick="bsTeacherModal(\''+store+'\')">+ 老师名单</button><button class="btn btn-primary" onclick="bsAttModal(\''+store+'\')">+ 录入出勤</button></div></div>';
  // 合同+生日提醒
  var contractWarn=teachers.filter(function(t){var e=contractExpire(t);return e&&e.days<=30&&e.days>=-30});
  var birthdayWarn=teachers.filter(function(t){var b=nextBirthday(t.birthday);return b&&b.days<=30&&b.days>=0});
  if(contractWarn.length||birthdayWarn.length){
    var alertHtml='<div class="alert-banner"><span class="alert-icon">🔔</span><div>';
    if(contractWarn.length)alertHtml+='<strong>合同到期：</strong>'+contractWarn.map(function(t){var e=contractExpire(t);return t.name+'('+(e.days>0?e.days+'天后':'已过期'+(-e.days)+'天')+')'}).join('、')+'　';
    if(birthdayWarn.length)alertHtml+='<strong>生日提醒：</strong>'+birthdayWarn.map(function(t){var b=nextBirthday(t.birthday);return t.name+'('+(b.days===0?'今天':'还有'+b.days+'天')+')'}).join('、');
    alertHtml+='</div></div>';
    main.innerHTML+=alertHtml;
  }
  // 统计卡片
  main.innerHTML+='<div class="card-grid g4 mb"><div class="stat"><div class="label">老师人数</div><div class="num">'+teachers.length+'</div></div><div class="stat"><div class="label">本周出勤率</div><div class="num '+(weekRate>=90?'text-green':weekRate>=75?'text-orange':'text-red')+'">'+weekRate+'<small>%</small></div></div><div class="stat"><div class="label">本月出勤率</div><div class="num '+(monthRate>=90?'text-green':monthRate>=75?'text-orange':'text-red')+'">'+monthRate+'<small>%</small></div></div><div class="stat"><div class="label">今日录入</div><div class="num">'+todayAtt.length+'<small>/'+teachers.length+'</small></div></div></div>';
  // 老师出勤率明细
  main.innerHTML+='<div class="card mb"><div class="card-title">各老师出勤率汇总</div><div class="table-wrap"><table><thead><tr><th>老师</th><th>本周出勤率</th><th>本月出勤率</th><th>本周记录</th><th>本月记录</th><th>合同到期</th><th>生日</th></tr></thead><tbody>'+(teachers.length?teachers.map(function(t){
    var tr=teacherRates.find(function(r){return r.name===t.name});
    var exp=contractExpire(t);var bd=nextBirthday(t.birthday);
    return'<tr><td><strong>'+esc(t.name)+'</strong></td><td><div class="flex" style="gap:8px"><span class="'+(tr.weekRate>=90?'text-green':tr.weekRate>=75?'text-orange':'text-red')+'">'+tr.weekRate+'%</span><div class="progress" style="width:80px"><div class="progress-bar '+(tr.weekRate>=90?'green':tr.weekRate>=75?'orange':'red')+'" style="width:'+tr.weekRate+'%"></div></div></div></td><td><div class="flex" style="gap:8px"><span class="'+(tr.monthRate>=90?'text-green':tr.monthRate>=75?'text-orange':'text-red')+'">'+tr.monthRate+'%</span><div class="progress" style="width:80px"><div class="progress-bar '+(tr.monthRate>=90?'green':tr.monthRate>=75?'orange':'red')+'" style="width:'+tr.monthRate+'%"></div></div></div></td><td class="text-sm">'+tr.weekRecords+'条</td><td class="text-sm">'+tr.monthRecords+'条</td><td class="text-sm '+(exp&&exp.days<=30?'text-red':'')+'">'+(exp?exp.date:'-')+(exp&&exp.days<=30?'（'+(exp.days>0?exp.days+'天后':'已过期')+')':'')+'</td><td class="text-sm '+(bd&&bd.days<=30?'text-orange':'')+'">'+t.birthday.slice(5)+(bd&&bd.days<=30?'（还有'+bd.days+'天）':'')+'</td></tr>';
  }).join(''):'<tr><td colspan="7" class="empty"><div class="big">👨‍🏫</div>暂无老师，请先添加老师名单</td></tr>')+'</tbody></table></div></div>';
  // 今日出勤快览
  main.innerHTML+='<div class="card mb"><div class="card-title flex-between">今日出勤（'+todayStr()+'） <button class="btn btn-sm" onclick="bsAttModal(\''+store+'\')">+ 录入</button></div><div class="table-wrap"><table><thead><tr><th>老师</th><th>应到</th><th>实到</th><th>出勤率</th><th></th></tr></thead><tbody>'+(todayAtt.length?todayAtt.map(function(a){var r=a.expected?a.actual/a.expected*100:0;return'<tr><td><strong>'+esc(a.teacherName)+'</strong></td><td>'+a.expected+'人</td><td>'+a.actual+'人</td><td><span class="'+(r>=90?'text-green':r>=75?'text-orange':'text-red')+'">'+Math.round(r)+'%</span></td><td><span class="del-x" onclick="delBSAtt('+a.id+')">×</span></td></tr>'}).join(''):'<tr><td colspan="5" class="empty">今日暂无出勤记录</td></tr>')+'</tbody></table></div></div>';
  // 最近出勤记录
  main.innerHTML+='<div class="card"><div class="card-title">最近出勤记录</div><div class="table-wrap"><table><thead><tr><th>日期</th><th>老师</th><th>应到</th><th>实到</th><th>出勤率</th><th></th></tr></thead><tbody>'+(recentAtt.length?recentAtt.map(function(a){var r=a.expected?a.actual/a.expected*100:0;return'<tr><td class="text-sm">'+a.date+'</td><td>'+esc(a.teacherName)+'</td><td>'+a.expected+'</td><td>'+a.actual+'</td><td><span class="'+(r>=90?'text-green':r>=75?'text-orange':'text-red')+'">'+Math.round(r)+'%</span></td><td><span class="del-x" onclick="delBSAtt('+a.id+')">×</span></td></tr>'}).join(''):'<tr><td colspan="6" class="empty"><div class="big">📋</div>暂无出勤记录，点击右上角开始录入</td></tr>')+'</tbody></table></div></div>';
}
modules.bs_wanke=function(main){renderBSAttendance(main,'万科店')};
modules.bs_gushui=function(main){renderBSAttendance(main,'谷水湾店')};

function bsTeacherModal(store){var ts=DB.get('bs_teachers',[]).filter(function(t){return t.store===store});showModal('<h2>'+store+' - 老师名单</h2><div class="text-sm text-sub mb2">共'+ts.length+'位老师</div><div class="table-wrap mb2"><table><thead><tr><th>姓名</th><th>电话</th><th>入职日期</th><th>合同期限</th><th>到期日</th><th>生日</th><th></th></tr></thead><tbody>'+ts.map(function(t){var exp=contractExpire(t);return'<tr><td><strong>'+esc(t.name)+'</strong></td><td class="text-sm">'+esc(t.phone)+'</td><td class="text-sm">'+t.joinDate+'</td><td>'+t.contractMonths+'个月</td><td class="text-sm '+(exp&&exp.days<=30?'text-red':'')+'">'+(exp?exp.date:'-')+'</td><td class="text-sm">'+t.birthday+'</td><td><button class="btn-icon" onclick="bsTeacherEdit('+t.id+')">✎</button> <span class="del-x" onclick="delBSTeacher('+t.id+','+t.store+')">×</span></td></tr>'}).join('')+'</tbody></table></div><div class="flex"><button class="btn" onclick="bsTeacherPaste(\''+store+'\')">📋 批量粘贴</button><button class="btn btn-primary" onclick="bsTeacherAdd(\''+store+'\')">+ 添加老师</button></div>');}
function bsTeacherAdd(store){showModal('<h2>添加老师 - '+store+'</h2><div class="modal-row"><label>姓名</label><input class="input" id="m_bt_name"></div><div class="modal-row"><label>电话</label><input class="input" id="m_bt_phone"></div><div class="modal-row"><label>入职日期</label><input class="input" type="date" id="m_bt_join" value="'+todayStr()+'"></div><div class="modal-row"><label>合同期限（月）</label><input class="input" type="number" id="m_bt_contract" value="12"></div><div class="modal-row"><label>生日（月日即可，如08-15）</label><input class="input" type="date" id="m_bt_birthday"></div><div class="modal-row"><label>备注</label><input class="input" id="m_bt_note"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveBSTeacher(0,\''+store+'\')">保存</button></div>');}
function bsTeacherEdit(id){var t=DB.get('bs_teachers',[]).find(function(x){return x.id===id});showModal('<h2>编辑老师 - '+esc(t.name)+'</h2><div class="modal-row"><label>姓名</label><input class="input" id="m_bt_name" value="'+esc(t.name)+'"></div><div class="modal-row"><label>电话</label><input class="input" id="m_bt_phone" value="'+esc(t.phone)+'"></div><div class="modal-row"><label>入职日期</label><input class="input" type="date" id="m_bt_join" value="'+t.joinDate+'"></div><div class="modal-row"><label>合同期限（月）</label><input class="input" type="number" id="m_bt_contract" value="'+t.contractMonths+'"></div><div class="modal-row"><label>生日</label><input class="input" type="date" id="m_bt_birthday" value="'+t.birthday+'"></div><div class="modal-row"><label>备注</label><input class="input" id="m_bt_note" value="'+esc(t.note||'')+'"></div><div class="modal-actions"><button class="btn btn-danger" style="margin-right:auto" onclick="delBSTeacher('+t.id+',\''+t.store+'\')">删除</button><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveBSTeacher('+t.id+',\''+t.store+'\')">保存</button></div>');}
function saveBSTeacher(id,store){var ts=DB.get('bs_teachers',[]);var bd=document.getElementById('m_bt_birthday').value;var d={name:document.getElementById('m_bt_name').value,phone:document.getElementById('m_bt_phone').value,joinDate:document.getElementById('m_bt_join').value,contractMonths:+document.getElementById('m_bt_contract').value,birthday:bd,note:document.getElementById('m_bt_note').value};if(id){Object.assign(ts.find(function(x){return x.id===id}),d)}else{ts.push(Object.assign({id:uid(),store:store},d))}DB.set('bs_teachers',ts);bsTeacherModal(store);renderRightPanel();}
function delBSTeacher(id,store){DB.set('bs_teachers',DB.get('bs_teachers',[]).filter(function(t){return t.id!==id}));bsTeacherModal(store);renderRightPanel();}
function bsTeacherPaste(store){showModal('<h2>批量粘贴老师名单 - '+store+'</h2><div class="modal-row"><label>粘贴数据（每行一条，用逗号分隔）</label><p class="text-sm text-sub mb2">格式：姓名, 电话, 入职日期, 合同月数, 生日(YYYY-MM-DD)</p><textarea class="input paste-area" id="m_paste_t" placeholder="王老师, 138****5555, 2024-06-01, 12, 1990-08-15&#10;李老师, 139****6666, 2025-01-15, 6, 1995-12-20"></textarea></div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveBSTeacherPaste(\''+store+'\')">批量导入</button></div>');}
function saveBSTeacherPaste(store){var txt=document.getElementById('m_paste_t').value.trim();if(!txt)return;var lines=txt.split('\n');var ts=DB.get('bs_teachers',[]);var count=0;lines.forEach(function(line){var f=line.split(/[\t,，]/).map(function(x){return x.trim()});if(f[0]){ts.push({id:uid(),name:f[0],phone:f[1]||'',joinDate:f[2]||todayStr(),contractMonths:+f[3]||12,birthday:f[4]||'',note:'',store:store});count++}});DB.set('bs_teachers',ts);bsTeacherModal(store);renderRightPanel();alert('成功导入'+count+'位老师');}

function bsAttModal(store){var ts=DB.get('bs_teachers',[]).filter(function(t){return t.store===store});var todayAtt=DB.get('bs_attendance',[]).filter(function(a){return a.store===store&&a.date===todayStr()});var html='<h2>录入出勤 - '+store+'</h2><div class="text-sm text-sub mb2">日期：'+todayStr()+' · 应到=应来上课的学生数 · 实到=实际到课学生数</div>';if(!ts.length){html+='<div class="empty"><div class="big">👨‍🏫</div>请先添加老师名单</div>'}else{ts.forEach(function(t){var ex=todayAtt.find(function(a){return a.teacherName===t.name});html+='<div class="modal-row"><label>'+esc(t.name)+'</label><div class="flex"><input class="input" type="number" id="m_att_exp_'+t.id+'" value="'+(ex?ex.expected:'')+'" placeholder="应到人数"><input class="input" type="number" id="m_att_act_'+t.id+'" value="'+(ex?ex.actual:'')+'" placeholder="实到人数"></div></div>'})}html+='<div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveBSAtt(\''+store+'\')" '+(ts.length?'':'disabled')+'>保存</button></div>';showModal(html);}
function saveBSAtt(store){var ts=DB.get('bs_teachers',[]).filter(function(t){return t.store===store});var att=DB.get('bs_attendance',[]);ts.forEach(function(t){var exp=+document.getElementById('m_att_exp_'+t.id).value;var act=+document.getElementById('m_att_act_'+t.id).value;if(exp>0||act>0){var existing=att.find(function(a){return a.store===store&&a.date===todayStr()&&a.teacherName===t.name});if(existing){existing.expected=exp;existing.actual=act}else{att.push({id:uid(),date:todayStr(),store:store,teacherName:t.name,expected:exp,actual:act})}}});DB.set('bs_attendance',att);closeModal();switchModule(store==='万科店'?'bs_wanke':'bs_gushui');}
function delBSAtt(id){DB.set('bs_attendance',DB.get('bs_attendance',[]).filter(function(a){return a.id!==id}));switchModule(currentModule);}

/* ===== Init ===== */
setGreeting();
switchModule('todo');
renderRightPanel();
updateBadges();

</script>
